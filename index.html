<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K: The Card Game - Online Multiplayer PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; user-select: none; }
        .perspective-table { perspective: 1200px; transform-style: preserve-3d; }
        .card-3d { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s; transform-style: preserve-3d; }
        .card-3d:hover { transform: translateY(-8px) rotateX(4deg); box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('MENU'); // MENU, HOST_LOBBY, JOIN_LOBBY, PLAYING, OVER
            const [roomCode, setRoomCode] = React.useState('');
            const [inputCode, setInputCode] = React.useState('');
            const [isHost, setIsHost] = React.useState(false);
            const [peer, setPeer] = React.useState(null);
            const [connections, setConnections] = React.useState([]); // For host: list of client connections
            const [hostConnection, setHostConnection] = React.useState(null); // For client: connection to host

            const [players, setPlayers] = React.useState([]);
            const [myPlayerId, setMyPlayerId] = React.useState(1);
            const [currentTurnIdx, setCurrentTurnIdx] = React.useState(0);
            const [centerPile, setCenterPile] = React.useState([]);
            const [roundNumber, setRoundNumber] = React.useState(1);
            const [startingPlayerIdx, setStartingPlayerIdx] = React.useState(0);
            const [log, setLog] = React.useState(["Welcome to K: The Card Game Online! Create or Join a room."]);
            const [selectedCardIdx, setSelectedCardIdx] = React.useState(null);
            const [winner, setWinner] = React.useState(null);

            const addLog = (msg) => setLog(prev => [msg, ...prev.slice(0, 15)]);

            // Generate random 4-char room code
            const generateCode = () => Math.random().toString(36.substring(2, 6)).toUpperCase();

            // Host a Room
            const hostGame = () => {
                const code = 'K-' + Math.floor(1000 + Math.random() * 9000);
                setRoomCode(code);
                setIsHost(true);
                const p = new Peer(code);
                
                p.on('open', (id) => {
                    addLog(`Room hosted successfully with code: ${code}`);
                    setView('HOST_LOBBY');
                    // Host is Player 1
                    setPlayers([{ id: 1, name: 'Host (You)', role: 'SAFE', hand: [], deck: [], completedTasks: 0, isAlive: true }]);
                });

                p.on('connection', (conn) => {
                    conn.on('open', () => {
                        setConnections(prev => [...prev, conn]);
                        addLog(`A new player connected to your room!`);
                        
                        conn.on('data', (data) => {
                            handleHostReceivedData(data, conn);
                        });
                    });
                });
                setPeer(p);
            };

            // Join a Room
            const joinGame = () => {
                if(!inputCode) {
                    alert("Please enter a valid room code.");
                    return;
                }
                setIsHost(false);
                const p = new Peer();
                
                p.on('open', (id) => {
                    const conn = p.connect(inputCode.trim());
                    setHostConnection(conn);

                    conn.on('open', () => {
                        addLog(`Connected to host room ${inputCode}! Waiting for game start.`);
                        setView('PLAYING');
                        conn.send({ type: 'JOIN_REQUEST', name: 'Player ' + Math.floor(Math.random() * 100) });
                    });

                    conn.on('data', (data) => {
                        handleClientReceivedData(data);
                    });
                });
                setPeer(p);
            };

            const handleHostReceivedData = (data, conn) => {
                if(data.type === 'JOIN_REQUEST') {
                    setPlayers(prev => {
                        const newId = prev.length + 1;
                        const updated = [...prev, { id: newId, name: data.name, role: 'SAFE', hand: [], deck: [], completedTasks: 0, isAlive: true }];
                        // Broadcast updated lobby/players
                        connections.forEach(c => c.send({ type: 'SYNC_STATE', players: updated }));
                        return updated;
                    });
                } else if(data.type === 'PLAYER_ACTION') {
                    // Process player action on host authority
                    processAction(data.playerIdx, data.actionType, data.cardIdx);
                }
            };

            const handleClientReceivedData = (data) => {
                if(data.type === 'SYNC_STATE') {
                    setPlayers(data.players);
                } else if(data.type === 'UPDATE_GAME') {
                    setPlayers(data.players);
                    setCenterPile(data.centerPile);
                    setCurrentTurnIdx(data.currentTurnIdx);
                    setRoundNumber(data.roundNumber);
                    setWinner(data.winner);
                    if(data.winner) setView('OVER');
                }
            };

            // Start Match as Host
            const startHostMatch = () => {
                let count = players.length;
                if(count < 2) {
                    alert("You need at least 2 players to start!");
                    return;
                }
                let killerCount = count >= 6 ? 2 : 1;
                let roles = [];
                for(let i=0; i<killerCount; i++) roles.push('KILLER');
                while(roles.length < count) roles.push('SAFE');
                roles.sort(() => Math.random() - 0.5);

                let updatedPlayers = players.map((p, i) => {
                    let deck = [];
                    for(let t=1; t<=4; t++) deck.push({ id: `t_${p.id}_${t}`, type: 'TASK', target: p.id, title: `Task ${t}`, desc: 'Complete objective.' });
                    for(let k=1; k<=2; k++) deck.push({ id: `k_${p.id}_${k}`, type: 'KILL', target: p.id, title: 'Kill Card', desc: 'Knife Attack!' });
                    deck.push({ id: `s_${p.id}`, type: 'SHIELD', title: 'Shield Card', desc: 'Protect from Death' });
                    deck.push({ id: `n_${p.id}`, type: 'NOBEE', title: 'Nobee Card', desc: 'Assistant Clue Collection' });
                    deck.push({ id: `c_${p.id}`, type: 'CLUE', title: 'Clue Card', desc: 'I Saw CCTV Footage' });
                    
                    deck.sort(() => Math.random() - 0.5);
                    let hand = deck.splice(0, 3);
                    return { ...p, role: roles[i], hand, deck };
                });

                setPlayers(updatedPlayers);
                setView('PLAYING');
                broadcastState(updatedPlayers, [], 0, 1, null);
                addLog(`Online match started with ${count} players!`);
            };

            const broadcastState = (newPlayers, newPile, turnIdx, roundNum, winState) => {
                const payload = { type: 'UPDATE_GAME', players: newPlayers, centerPile: newPile, currentTurnIdx: turnIdx, roundNumber: roundNum, winner: winState };
                connections.forEach(c => c.send(payload));
            };

            const handleHumanAction = (actionType) => {
                if(selectedCardIdx === null) return;
                if(isHost) {
                    processAction(0, actionType, selectedCardIdx);
                } else {
                    hostConnection.send({ type: 'PLAYER_ACTION', playerIdx: 0, actionType, cardIdx: selectedCardIdx });
                }
                setSelectedCardIdx(null);
            };

            const processAction = (playerIdx, actionType, cardIdx) => {
                let newPlayers = [...players];
                let activePlayer = newPlayers[playerIdx];
                let card = activePlayer.hand.splice(cardIdx, 1)[0];

                let newPile = [...centerPile];
                if(actionType === 'CENTER' || actionType === 'FACEUP') {
                    newPile.push({ ...card, playedBy: activePlayer.id, faceUp: actionType === 'FACEUP' });
                    addLog(`${activePlayer.name} placed a card into the center pile.`);
                } else if(actionType === 'DECK') {
                    let nextIdx = (playerIdx + 1) % newPlayers.length;
                    newPlayers[nextIdx].deck.unshift(card);
                    addLog(`${activePlayer.name} passed a card face-down to next deck.`);
                }

                // Advance turn
                let nextTurn = (currentTurnIdx + 1) % newPlayers.length;
                if(nextTurn === 0) {
                    // End of round resolution
                    addLog(`--- Round ${roundNumber} Resolution ---`);
                    let kills = [];
                    let shields = 0;
                    newPile.forEach(c => {
                        if(c.type === 'TASK') {
                            let targetP = newPlayers.find(p => p.id === c.target);
                            if(targetP && targetP.isAlive) targetP.completedTasks += 1;
                        } else if(c.type === 'KILL') {
                            kills.push(c.target);
                        } else if(c.type === 'SHIELD') {
                            shields++;
                        }
                    });

                    kills.forEach(targetId => {
                        let targetP = newPlayers.find(p => p.id === targetId);
                        if(targetP && targetP.isAlive) {
                            if(shields > 0) { shields--; }
                            else { targetP.isAlive = false; addLog(`${targetP.name} was eliminated!`); }
                        }
                    });

                    // Refill hands
                    newPlayers.forEach(p => {
                        if(p.isAlive) {
                            while(p.hand.length < 3 && p.deck.length > 0) p.hand.push(p.deck.shift());
                        }
                    });

                    newPile = [];
                    setRoundNumber(prev => prev + 1);
                }

                setPlayers(newPlayers);
                setCenterPile(newPile);
                setCurrentTurnIdx(nextTurn);
                broadcastState(newPlayers, newPile, nextTurn, roundNumber, winner);
            };

            const myPlayer = players[isHost ? 0 : 0] || { hand: [], role: 'SAFE', completedTasks: 0 };

            return (
                <div className="flex-1 flex flex-col max-w-6xl mx-auto w-full p-3 sm:p-6">
                    <header className="flex justify-between items-center mb-4 bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                        <span className="text-xl font-black bg-gradient-to-r from-red-500 to-amber-500 bg-clip-text text-transparent">K: THE CARD GAME (ONLINE)</span>
                        {view === 'PLAYING' && (
                            <div className="flex items-center space-x-2">
                                <span className="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">Round {roundNumber}</span>
                                <div className="px-3 py-1 rounded-full font-bold text-xs bg-red-950/50 border border-red-600 text-red-400">
                                    ROLE: {myPlayer.role}
                                </div>
                            </div>
                        )}
                    </header>

                    {view === 'MENU' && (
                        <div className="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-6">
                            <h1 className="text-4xl sm:text-6xl font-black text-white">Online Rooms</h1>
                            <p className="text-slate-400 max-w-md mx-auto">Create a private room to host your friends or join an existing room code.</p>
                            <div className="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
                                <button onClick={hostGame} className="w-full py-3.5 bg-red-600 hover:bg-red-500 font-bold rounded-xl text-white shadow">
                                    CREATE ROOM (HOST)
                                </button>
                                <div className="flex space-x-2 pt-2">
                                    <input type="text" placeholder="Enter Room Code" value={inputCode} onChange={(e) => setInputCode(e.target.value)} className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 text-sm text-white uppercase" />
                                    <button onClick={joinGame} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl text-white border border-slate-700 text-sm">
                                        JOIN
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'HOST_LOBBY' && (
                        <div className="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-6">
                            <h2 className="text-3xl font-black text-white">Hosting Room</h2>
                            <div className="text-4xl font-mono font-bold text-red-500 bg-slate-900 border border-slate-800 px-6 py-3 rounded-2xl">{roomCode}</div>
                            <p className="text-slate-400 text-sm">Share this code with your friends so they can join your lobby!</p>
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl w-full max-w-md text-left">
                                <div className="text-xs font-bold text-slate-400 mb-2">PLAYERS IN LOBBY ({players.length}):</div>
                                {players.map(p => <div key={p.id} className="text-sm font-semibold text-white py-1">&bull; {p.name}</div>)}
                            </div>
                            <button onClick={startHostMatch} className="px-8 py-3.5 bg-red-600 hover:bg-red-500 font-bold rounded-xl text-white shadow">
                                START GAME NOW
                            </button>
                        </div>
                    )}

                    {view === 'PLAYING' && (
                        <div className="flex-1 flex flex-col space-y-4">
                            <div className="flex-1 bg-slate-900/90 border border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-center relative min-h-[200px]">
                                <div className="absolute top-3 left-4 text-xs font-semibold text-slate-500 uppercase">Center Pile ({centerPile.length} cards)</div>
                                <div className="flex flex-wrap gap-2 justify-center max-w-md">
                                    {centerPile.map((c, i) => (
                                        <div key={i} className="w-16 h-24 bg-slate-800 border border-slate-700 rounded-lg p-1.5 flex flex-col justify-between text-[10px]">
                                            <span className="font-bold text-red-400">{c.type}</span>
                                            <span className="text-slate-300 text-center truncate">{c.title}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div className="md:col-span-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-3 h-28 overflow-y-auto text-xs space-y-1 font-mono text-slate-300">
                                    <div className="text-slate-500 font-bold mb-1">=== GAME LOG ===</div>
                                    {log.map((l, i) => <div key={i}>&gt; {l}</div>)}
                                </div>
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 flex flex-col justify-center space-y-2">
                                    {selectedCardIdx !== null ? (
                                        <div className="flex flex-col space-y-2">
                                            <button onClick={() => handleHumanAction('CENTER')} className="w-full py-2 bg-red-600 text-white font-bold rounded-xl text-xs">Place in Center Pile</button>
                                            <button onClick={() => handleHumanAction('DECK')} className="w-full py-2 bg-slate-800 text-slate-200 font-bold rounded-xl text-xs border border-slate-700">Pass to Next Deck</button>
                                        </div>
                                    ) : (
                                        <div className="text-xs text-slate-500 text-center italic">Select a card from your hand</div>
                                    )}
                                </div>
                            </div>

                            <div className="p-4 rounded-3xl border bg-slate-900/60 border-slate-800 flex flex-col space-y-2">
                                <div className="flex justify-between items-center px-1">
                                    <span className="text-xs font-bold text-slate-300">YOUR HAND ({myPlayer.hand.length})</span>
                                    <span className="text-[11px] text-slate-400">Tasks: <strong>{myPlayer.completedTasks}/4</strong></span>
                                </div>
                                <div className="flex space-x-3 overflow-x-auto pb-2 pt-1">
                                    {myPlayer.hand.map((card, idx) => (
                                        <div key={card.id} onClick={() => setSelectedCardIdx(idx)} className={`w-28 h-40 bg-slate-900 border-2 rounded-2xl p-3 flex flex-col justify-between cursor-pointer card-3d flex-shrink-0 ${selectedCardIdx === idx ? 'border-red-500 ring-2 ring-red-500/50 -translate-y-2' : 'border-slate-800'}`}>
                                            <span className="text-[10px] font-black text-red-400">{card.type}</span>
                                            <div>
                                                <h4 className="font-bold text-xs text-white">{card.title}</h4>
                                                <p className="text-[10px] text-slate-400 mt-1">{card.desc}</p>
                                            </div>
                                            <span className="text-[9px] text-right text-slate-500">P{card.id}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
