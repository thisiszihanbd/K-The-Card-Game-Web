<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K? The Card Game - Pro 5.2 Stability Fix</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { red: '#dc2626', darkRed: '#7f1d1d', slate: '#09090b', cardBg: '#18181b', gold: '#f59e0b', emerald: '#10b981' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- React 18, Babel & PeerJS -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      background-color: #09090b;
      color: #f4f4f5;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.9); }
    }
    .active-turn-glow { animation: pulseGlow 1.5s infinite ease-in-out; border-color: #dc2626; }

    @keyframes cardFlip {
      0% { transform: rotateY(90deg) scale(1.1); opacity: 0; }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    .card-flip-anim { animation: cardFlip 0.4s ease-out forwards; }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
  </style>
</head>
<body class="h-full w-full overflow-hidden font-sans antialiased select-none flex justify-center">
  <div id="root" class="h-full w-full max-w-[1600px] flex flex-col relative overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        this.setState({ errorInfo });
        console.error("Game Engine Crash:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-full w-full bg-red-950 text-red-200 p-8 overflow-auto font-mono text-sm">
              <h1 className="text-3xl font-black text-white mb-4">CRITICAL SYSTEM FAILURE</h1>
              <p className="mb-4">The game engine encountered an unhandled rendering exception.</p>
              <button onClick={() => window.location.reload()} className="bg-white text-red-900 px-4 py-2 font-bold rounded mb-6">REBOOT ENGINE</button>
              <h2 className="text-xl font-bold text-white mb-2">Error:</h2>
              <pre className="bg-black/50 p-4 rounded mb-4 whitespace-pre-wrap">{this.state.error && this.state.error.toString()}</pre>
              <h2 className="text-xl font-bold text-white mb-2">Component Stack:</h2>
              <pre className="bg-black/50 p-4 rounded whitespace-pre-wrap">{this.state.errorInfo && this.state.errorInfo.componentStack}</pre>
            </div>
          );
        }
        return this.props.children; 
      }
    }

    const playAudioFx = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'card') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(420, now); osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'play') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'kill') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now); osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);
          gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'shield') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(900, now + 0.08);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const subOsc = ctx.createOscillator(); const subGain = ctx.createGain();
            subOsc.connect(subGain); subOsc.connect(ctx.destination);
            subOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
            subGain.gain.setValueAtTime(0.2, now + idx * 0.1); subGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
            subOsc.start(now + idx * 0.1); subOsc.stop(now + idx * 0.1 + 0.3);
          });
        }
      } catch (e) {}
    };

    const eliminateAndDistributeCards = (eliminatedPId, playerList) => {
      const victim = playerList.find(p => p.id === eliminatedPId);
      if (!victim || !victim.isAlive) return playerList;
      const cardsToDistribute = [...(victim.hand || []), ...(victim.deck || [])];
      for (let i = cardsToDistribute.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cardsToDistribute[i], cardsToDistribute[j]] = [cardsToDistribute[j], cardsToDistribute[i]];
      }
      let updatedList = playerList.map(p => p.id === eliminatedPId ? { ...p, isAlive: false, revealedRole: true, hand: [], deck: [] } : p);
      const survivors = updatedList.filter(p => p.isAlive);
      if (survivors.length > 0 && cardsToDistribute.length > 0) {
        cardsToDistribute.forEach((card, idx) => {
          const recipientId = survivors[idx % survivors.length].id;
          updatedList = updatedList.map(p => p.id === recipientId ? { ...p, deck: [card, ...p.deck] } : p);
        });
      }
      return updatedList;
    };

    const CLUE_TYPES = {
      CCTV: { name: 'I Saw The CCTV Footage', desc: 'Scans and reveals which players hold a Kill card in hand.' },
      SHOW_ME: { name: 'Show Me What You Got!', desc: 'Opens target player\'s hand cards for visual inspection.' },
      SABOTAGE: { name: 'Sabotage', desc: 'Revokes up to 2 completed tasks to break progress and revoke Gift Card.' },
      NEEDING: { name: "I'll Be Needing That", desc: 'Steal a specific card or Gift Card directly from target\'s hand.' },
      CHANGE_PLAN: { name: 'Change of Plan', desc: 'All players pass their current hand to the player on their right.' },
      EYES_ON_YOU: { name: 'I Have My Eyes on You!', desc: 'Blocks Center Pile plays for the rest of this round.' }
    };

    const generateDecks = (playerList) => {
      const playerCount = playerList.length;
      let killerCount = 1;
      if (playerCount >= 6 && playerCount <= 8) killerCount = 2;
      if (playerCount >= 9) killerCount = 3;

      let roles = Array(killerCount).fill('KILLER').concat(Array(playerCount - killerCount).fill('SAFE'));
      roles.sort(() => Math.random() - 0.5);

      let mainDeck = [];
      playerList.forEach(p => {
        for (let t = 1; t <= 4; t++) mainDeck.push({ id: `task_${p.id}_${t}_${Math.random()}`, type: 'TASK', targetPlayer: p.id, taskNum: t, name: `${p.name} Task ${t}`, desc: `Counts toward ${p.name}'s required tasks.` });
        for (let k = 1; k <= 2; k++) mainDeck.push({ id: `kill_${p.id}_${k}_${Math.random()}`, type: 'KILL', targetPlayer: p.id, name: `${p.name} Kill Card`, desc: `Attacks ${p.name} unless blocked.` });
        mainDeck.push({ id: `shield_${p.id}_${Math.random()}`, type: 'SHIELD', name: 'Shield Card', desc: 'Blocks 1 Kill Card attack.' });
        mainDeck.push({ id: `nobee_${p.id}_${Math.random()}`, type: 'NOBEE', name: "Assistant's Nobee", desc: "Visually inspect target's full hand or target's deck." });
      });

      let antikCount = playerCount <= 5 ? 1 : (playerCount <= 8 ? 2 : 3);
      for (let a = 1; a <= antikCount; a++) mainDeck.push({ id: `antik_${a}_${Math.random()}`, type: 'ANTIK', name: "Detective's Antik", desc: "Make a high-stakes accusation!" });

      const clueKeys = Object.keys(CLUE_TYPES);
      let clueCount = playerCount === 4 ? 3 : (playerCount <= 6 ? 4 : (playerCount === 7 ? 5 : (playerCount <= 9 ? 6 : 7)));
      for (let c = 0; c < clueCount; c++) {
        const cKey = clueKeys[c % clueKeys.length];
        mainDeck.push({ id: `clue_${c}_${Math.random()}`, type: 'CLUE', clueKey: cKey, name: CLUE_TYPES[cKey].name, desc: CLUE_TYPES[cKey].desc });
      }

      mainDeck.sort(() => Math.random() - 0.5);
      const playerDecks = {};
      const playerHands = {};
      playerList.forEach(p => {
        playerDecks[p.id] = mainDeck.splice(0, 9);
        playerHands[p.id] = playerDecks[p.id].splice(0, 3);
      });

      return { roles, playerDecks, playerHands };
    };

    function VisualCard({ card, onClick, isSelected, showTarget = true, extraBadge }) {
      if (!card) return null;
      const getTypeStyle = (type) => {
        switch(type) {
          case 'TASK': return { badge: 'bg-emerald-950 text-emerald-400 border-emerald-800', border: 'border-emerald-600/60', icon: '✅' };
          case 'KILL': return { badge: 'bg-red-950 text-red-400 border-red-800', border: 'border-red-600/80', icon: '🗡️' };
          case 'SHIELD': return { badge: 'bg-blue-950 text-blue-400 border-blue-800', border: 'border-blue-600/60', icon: '🛡️' };
          case 'NOBEE': return { badge: 'bg-purple-950 text-purple-400 border-purple-800', border: 'border-purple-600/60', icon: '🔍' };
          case 'ANTIK': return { badge: 'bg-amber-950 text-amber-400 border-amber-800', border: 'border-amber-600/80', icon: '🕵️' };
          case 'CLUE': return { badge: 'bg-cyan-950 text-cyan-400 border-cyan-800', border: 'border-cyan-600/60', icon: '💡' };
          case 'GIFT': return { badge: 'bg-yellow-950 text-yellow-300 border-yellow-600', border: 'border-yellow-500', icon: '🎁' };
          default: return { badge: 'bg-zinc-800 text-zinc-300 border-zinc-700', border: 'border-zinc-700', icon: '🃏' };
        }
      };
      const style = getTypeStyle(card.type);
      return (
        <div onClick={onClick} className={`p-3 rounded-2xl border flex flex-col justify-between h-36 md:h-44 relative transition-all ${onClick ? 'cursor-pointer hover:scale-105 active:scale-95' : ''} ${isSelected ? 'bg-red-950/80 border-red-500 ring-2 ring-red-500 scale-[1.02] md:scale-110 shadow-lg shadow-red-900/40 -translate-y-2 md:-translate-y-4' : `bg-zinc-900/90 ${style.border}`}`}>
          <div className="flex justify-between items-start">
            <span className={`text-[9px] md:text-xs font-black uppercase px-2 py-0.5 rounded-full border ${style.badge}`}>{card.type}</span>
            <span className="text-base md:text-xl">{style.icon}</span>
          </div>
          <div className="my-1">
            <div className="text-[11px] md:text-sm font-black text-white leading-tight line-clamp-2">{card.name}</div>
          </div>
          <div className="text-[9px] md:text-xs text-zinc-400 leading-tight line-clamp-2">{card.desc}</div>
          {extraBadge && <div className="absolute -top-2 -right-2 bg-amber-500 text-black text-[9px] md:text-xs font-black px-2 py-0.5 rounded-full shadow">{extraBadge}</div>}
        </div>
      );
    }

    function App() {
      const [networkMode, setNetworkMode] = useState('SOLO');
      const [roomCode, setRoomCode] = useState('');
      const [joinCode, setJoinCode] = useState('');
      const [myId, setMyId] = useState(1);
      
      const [gameState, setGameState] = useState('MENU');
      const [playerCount, setPlayerCount] = useState(4);
      const [players, setPlayers] = useState([]);
      const [roundStartingIndex, setRoundStartingIndex] = useState(0);
      const [turnQueue, setTurnQueue] = useState([]);
      const [queueIndex, setQueueIndex] = useState(0);
      const [currentRound, setCurrentRound] = useState(1);
      
      const [centerPile, setCenterPile] = useState([]);
      const [centerPileBlocked, setCenterPileBlocked] = useState(false);
      const [completedTasks, setCompletedTasks] = useState({});
      const [giftCardHolder, setGiftCardHolder] = useState(null);
      const [gameWinner, setGameWinner] = useState(null);
      const [turnLogs, setTurnLogs] = useState(['Waiting to deploy match...']);
      const [botThinkingStatus, setBotThinkingStatus] = useState(null);
      
      const [selectedCard, setSelectedCard] = useState(null);
      const [activeModal, setActiveModal] = useState(null);
      const [modalData, setModalData] = useState(null);
      const [modalOwnerId, setModalOwnerId] = useState(null);

      const peerRef = useRef(null);
      const connsRef = useRef([]);
      const botTimeoutRef = useRef(null);

      const processActionRef = useRef();
      const executeBotDecisionRef = useRef();
      
      useEffect(() => {
        processActionRef.current = processAction;
        executeBotDecisionRef.current = executeBotDecision;
      });

      const addLog = (msg) => setTurnLogs(prev => [msg, ...prev.slice(0, 49)]);

      const setActiveModalFor = (modal, ownerId, data = null) => {
        setActiveModal(modal);
        setModalOwnerId(ownerId);
        if (data !== null) setModalData(data);
      };

      useEffect(() => {
        if (networkMode === 'HOST' || networkMode === 'SOLO') {
          const stateToSync = {
            gameState, players, roundStartingIndex, turnQueue, queueIndex, currentRound,
            centerPile, centerPileBlocked, completedTasks, giftCardHolder, gameWinner,
            turnLogs, activeModal, modalData, modalOwnerId, botThinkingStatus, playerCount
          };
          if (networkMode === 'HOST') {
            connsRef.current.forEach(c => c.send({ type: 'SYNC', state: stateToSync }));
          }
        }
      }, [gameState, players, roundStartingIndex, turnQueue, queueIndex, currentRound, centerPile, centerPileBlocked, completedTasks, giftCardHolder, gameWinner, turnLogs, activeModal, modalData, modalOwnerId, botThinkingStatus, playerCount, networkMode]);

      const dispatchAction = (actionType, payload) => {
        if (networkMode === 'JOIN') {
          try {
            connsRef.current[0].send({ type: 'ACTION', actionType, payload });
          } catch (e) {
            console.error("Network Error:", e);
          }
          setSelectedCard(null); 
        } else {
          processAction(actionType, payload);
        }
      };

      const processAction = (actionType, payload) => {
        switch(actionType) {
          case 'PLAY_CARD': executeCardPlay(payload.pId, payload.card, payload.dest); break;
          case 'RESOLVE_NOBEE': resolveNobeeAction(payload.targetPId, payload.mode); break;
          case 'RESOLVE_SHOW_ME': resolveShowMeTargetSelect(payload.targetPId); break;
          case 'RESOLVE_NEEDING': resolveNeedingTargetSelect(payload.targetPId); break;
          case 'STEAL_SPECIFIC': resolveStealSpecificCard(payload.card, payload.targetPId); break;
          case 'STEAL_GIFT': resolveStealGiftCard(payload.targetPId); break;
          case 'SABOTAGE_TARGET': handleSabotageTargetSelect(payload.targetPId); break;
          case 'SABOTAGE_REDISTRIBUTE': resolveSabotageRedistribute(payload.recipientPId); break;
          case 'ANTIK_ACCUSE': resolveAntikAccusation(payload.accuserId, payload.targetId, players); break;
          case 'TRIGGER_REVEAL': setActiveModalFor('REVEAL_ANIM', 'ALL', { pile: centerPile, currentPlayers: players }); break;
          case 'FINALIZE_ROUND': finalizeResolution(payload.pile, players); break;
          case 'CLOSE_MODAL': setActiveModalFor(null, null); advanceTurnQueue(); break;
          default: break;
        }
      };

      const hostRoom = () => {
        const code = 'K' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(code);
        peerRef.current = peer;

        peer.on('open', () => {
          setNetworkMode('HOST');
          setRoomCode(code);
          setPlayers([{ id: 1, name: 'Player 1', isBot: false }]);
          setMyId(1);
        });

        peer.on('connection', (conn) => {
          connsRef.current.push(conn);
          setPlayers(prev => {
            const newId = prev.length + 1;
            const newRoster = [...prev, { id: newId, name: `Player ${newId}`, isBot: false }];
            conn.on('open', () => { conn.send({ type: 'WELCOME', assignedId: newId, roster: newRoster }); });
            return newRoster;
          });
          
          conn.on('data', data => { 
            if (data.type === 'ACTION' && processActionRef.current) {
               processActionRef.current(data.actionType, data.payload); 
            }
          });
        });
      };

      const joinRoom = () => {
        const code = joinCode.trim().toUpperCase();
        if (!code) return alert('Enter code!');
        const peer = new Peer();
        peerRef.current = peer;

        peer.on('open', () => {
          const conn = peer.connect(code);
          connsRef.current = [conn];

          conn.on('open', () => { setNetworkMode('JOIN'); setRoomCode(code); });

          conn.on('data', data => {
            if (data.type === 'WELCOME') {
              setMyId(data.assignedId);
              setPlayers(data.roster);
            } else if (data.type === 'SYNC') {
              setPlayers(data.state.players);
              setGameState(data.state.gameState);
              setTurnQueue(data.state.turnQueue);
              setQueueIndex(data.state.queueIndex);
              setRoundStartingIndex(data.state.roundStartingIndex);
              setCurrentRound(data.state.currentRound);
              setCenterPile(data.state.centerPile);
              setCenterPileBlocked(data.state.centerPileBlocked);
              setCompletedTasks(data.state.completedTasks);
              setGiftCardHolder(data.state.giftCardHolder);
              setGameWinner(data.state.gameWinner);
              setTurnLogs(data.state.turnLogs);
              setActiveModal(data.state.activeModal);
              setModalData(data.state.modalData);
              setModalOwnerId(data.state.modalOwnerId);
              setBotThinkingStatus(data.state.botThinkingStatus);
              if (data.state.playerCount) setPlayerCount(data.state.playerCount);
            }
          });
        });
      };

      const startGame = (mode) => {
        playAudioFx('play');
        let pList = [];
        let hCount = 1;
        let bCount = 1;

        if (mode === 'SOLO') {
          setNetworkMode('SOLO'); setMyId(1);
          pList.push({ id: 1, name: `Player ${hCount++}`, isBot: false });
          while (pList.length < playerCount) pList.push({ id: pList.length + 1, name: `Bot ${bCount++}`, isBot: true });
        } else if (mode === 'HOST') {
          pList = [...players];
          pList.forEach(p => { if (!p.isBot) p.name = `Player ${hCount++}`; });
          while (pList.length < playerCount) pList.push({ id: pList.length + 1, name: `Bot ${bCount++}`, isBot: true });
        }

        const { roles, playerDecks, playerHands } = generateDecks(pList);
        pList = pList.map((p, idx) => ({ ...p, role: roles[idx], deck: playerDecks[p.id], hand: playerHands[p.id], isAlive: true, revealedRole: false }));
        
        const initialQueue = pList.filter(p => p.isAlive).map(p => p.id);
        const initTasks = {}; pList.forEach(p => initTasks[p.id] = []);

        setPlayers(pList);
        setCompletedTasks(initTasks);
        setTurnQueue(initialQueue);
        setQueueIndex(0);
        setRoundStartingIndex(0);
        setCurrentRound(1);
        setCenterPile([]);
        setCenterPileBlocked(false);
        setGiftCardHolder(null);
        setGameWinner(null);
        setActiveModalFor(null, null);
        setTurnLogs([`🎮 Match live! Dynamic players locked in.`]);
        setGameState('PLAYING');
      };

      const activePlayerId = turnQueue[queueIndex] || null;
      const activePlayer = players.find(p => p.id === activePlayerId) || null;
      const myPlayer = players.find(p => p.id === myId) || {};

      useEffect(() => {
        if (gameState !== 'PLAYING' || !activePlayer || !activePlayer.isBot || !activePlayer.isAlive) return;
        if (networkMode === 'JOIN') return; 

        setBotThinkingStatus(`${activePlayer.name} is making a move...`);
        
        botTimeoutRef.current = setTimeout(() => {
          if (executeBotDecisionRef.current) executeBotDecisionRef.current(activePlayer);
        }, 1500);

        return () => clearTimeout(botTimeoutRef.current);
      }, [gameState, queueIndex, turnQueue, networkMode, activePlayer]);

      const executeBotDecision = (bot) => {
        const hand = bot.hand || [];
        if (hand.length === 0) {
          addLog(`🤖 ${bot.name} passes turn due to empty hand.`);
          advanceTurnQueue();
          return;
        }

        let cardToPlay = hand[0];
        let destination = 'CENTER';

        const playableSpecials = hand.filter(c => {
          if (c.type === 'ANTIK') return bot.role === 'SAFE' && currentRound >= 3;
          return ['NOBEE', 'CLUE', 'GIFT'].includes(c.type);
        });

        if (playableSpecials.length > 0 && Math.random() > 0.4) {
          cardToPlay = playableSpecials[Math.floor(Math.random() * playableSpecials.length)];
          destination = 'FACE_UP';
        } else if (bot.role === 'KILLER') {
          const killCard = hand.find(c => c.type === 'KILL');
          if (killCard && !centerPileBlocked) { cardToPlay = killCard; destination = 'CENTER'; }
          else { destination = 'NEXT_DECK'; }
        } else {
          const taskCard = hand.find(c => c.type === 'TASK');
          const shieldCard = hand.find(c => c.type === 'SHIELD');
          const killCard = hand.find(c => c.type === 'KILL');

          if (taskCard && !centerPileBlocked) { cardToPlay = taskCard; destination = 'CENTER'; }
          else if (shieldCard && !centerPileBlocked) { cardToPlay = shieldCard; destination = 'CENTER'; }
          else if (killCard) { cardToPlay = killCard; destination = 'NEXT_DECK'; }
          else { destination = 'NEXT_DECK'; }
        }

        executeCardPlay(bot.id, cardToPlay, destination);
      };

      const executeCardPlay = (playerId, card, destination) => {
        playAudioFx('play');
        setBotThinkingStatus(null);
        let updatedPlayers = players.map(p => p.id === playerId ? { ...p, hand: p.hand.filter(c => c.id !== card.id) } : p);
        let updatedPile = [...centerPile];

        if (destination === 'CENTER') {
          updatedPile.push({ ...card, playedBy: playerId });
          addLog(`🂠 ${getPlayerName(playerId)} played a card into Center Pile.`);
        } else if (destination === 'NEXT_DECK') {
          let nextPIdx = (updatedPlayers.findIndex(p => p.id === playerId) + 1) % updatedPlayers.length;
          while (!updatedPlayers[nextPIdx].isAlive) nextPIdx = (nextPIdx + 1) % updatedPlayers.length;
          const targetPlayer = updatedPlayers[nextPIdx];
          
          updatedPlayers = updatedPlayers.map((p, idx) => idx === nextPIdx ? { ...p, deck: [card, ...(p.deck || [])] } : p);
          addLog(`🤝 ${getPlayerName(playerId)} passed a card to ${targetPlayer.name}'s Deck.`);
        } else if (destination === 'FACE_UP') {
          addLog(`📢 ${getPlayerName(playerId)} dropped ${card.name} FACE-UP!`);
          if (card.type === 'NOBEE') { setPlayers(updatedPlayers); setCenterPile(updatedPile); setSelectedCard(null); handleNobeePlay(playerId, card, updatedPlayers, updatedPile); return; }
          else if (card.type === 'ANTIK') { setPlayers(updatedPlayers); setCenterPile(updatedPile); setSelectedCard(null); handleAntikPlay(playerId, card, updatedPlayers, updatedPile); return; }
          else if (card.type === 'GIFT') { setPlayers(updatedPlayers); setCenterPile(updatedPile); setSelectedCard(null); handleGiftPlay(playerId, card, updatedPlayers, updatedPile); return; }
          else if (card.type === 'CLUE') { setPlayers(updatedPlayers); setCenterPile(updatedPile); setSelectedCard(null); handleCluePlay(playerId, card, updatedPlayers, updatedPile); return; }
        }

        setPlayers(updatedPlayers);
        setCenterPile(updatedPile);
        setSelectedCard(null);
        advanceTurnQueue(updatedPlayers, updatedPile);
      };

      const getPlayerName = (pId) => {
        const found = players.find(p => p.id === pId);
        return found ? found.name : `Player ${pId}`;
      };

      const advanceTurnQueue = (latestPlayers = players, latestPile = centerPile) => {
        const nextQIdx = queueIndex + 1;
        if (nextQIdx >= turnQueue.length) {
          setTimeout(() => setActiveModalFor('REVEAL_ANIM', 'ALL', { pile: latestPile, currentPlayers: latestPlayers }), 600);
        } else {
          setQueueIndex(nextQIdx);
        }
      };

      const handleNobeePlay = (pId, card, currentPlayers, updatedPile) => {
        const actor = currentPlayers.find(p => p.id === pId);
        if (actor.isBot) {
          const targets = currentPlayers.filter(p => p.id !== pId && p.isAlive);
          if (targets.length > 0) {
            const target = targets[Math.floor(Math.random() * targets.length)];
            const scanDeck = Math.random() > 0.5;
            addLog(`🔍 ${actor.name} scanned ${target.name}'s ${scanDeck ? 'deck' : 'hand'}.`);
          }
          advanceTurnQueue(currentPlayers, updatedPile);
        } else {
          setActiveModalFor('NOBEE_CHOICE', pId);
        }
      };

      const resolveNobeeAction = (targetPId, mode) => {
        const target = players.find(p => p.id === targetPId);
        if (mode === 'HAND') {
          playAudioFx('card'); addLog(`🔍 NOBEE: Inspected ${target.name}'s hand.`);
          setActiveModalFor('VISUAL_CARD_PEEK', activePlayer.id, { title: `${target.name}'s Hand Cards`, cards: target.hand, isCenter: false });
        } else if (mode === 'DECK') {
          playAudioFx('card'); addLog(`🔍 NOBEE: Inspected ${target.name}'s deck.`);
          setActiveModalFor('VISUAL_CARD_PEEK', activePlayer.id, { title: `${target.name}'s Deck Cards`, cards: target.deck, isCenter: false });
        }
      };

      const handleCluePlay = (pId, card, currentPlayers, updatedPile) => {
        const clueKey = card.clueKey;
        const actor = currentPlayers.find(p => p.id === pId);

        if (clueKey === 'SHOW_ME') {
          if (actor.isBot) { 
            const targets = currentPlayers.filter(p => p.id !== pId && p.isAlive && p.hand.length > 0);
            if(targets.length > 0) addLog(`📢 "Show Me": ${actor.name} inspected ${targets[Math.floor(Math.random()*targets.length)].name}'s hand.`);
            advanceTurnQueue(currentPlayers, updatedPile); 
          }
          else setActiveModalFor('SHOW_ME_TARGET', pId);
        } else if (clueKey === 'NEEDING') {
          if (actor.isBot) { 
            const targets = currentPlayers.filter(p => p.id !== pId && p.isAlive && p.hand.length > 0);
            if(targets.length > 0) {
                 const target = targets[Math.floor(Math.random() * targets.length)];
                 const stolen = target.hand[Math.floor(Math.random() * target.hand.length)];
                 const updated = currentPlayers.map(p => {
                    if (p.id === target.id) return { ...p, hand: p.hand.filter(c => c.id !== stolen.id) };
                    if (p.id === pId) return { ...p, hand: [...p.hand, stolen] };
                    return p;
                 });
                 setPlayers(updated);
                 addLog(`🪝 ${actor.name} stole a card from ${target.name}!`);
                 advanceTurnQueue(updated, updatedPile);
            } else { advanceTurnQueue(currentPlayers, updatedPile); }
          }
          else setActiveModalFor('NEEDING_TARGET', pId);
        } else if (clueKey === 'SABOTAGE') {
          if (actor.isBot) { 
            const targets = currentPlayers.filter(p => p.id !== pId && (completedTasks[p.id] || []).length >= 1);
            if (targets.length > 0) {
                 const target = targets[Math.floor(Math.random() * targets.length)];
                 const removed = completedTasks[target.id].slice(0, 1);
                 const remaining = completedTasks[target.id].slice(1);
                 const newTasksMap = { ...completedTasks, [target.id]: remaining, [pId]: [...(completedTasks[pId] || []), ...removed] };
                 
                 let updated = [...currentPlayers];
                 if (remaining.length < 4 && Number(giftCardHolder) === target.id) {
                    setGiftCardHolder(null); addLog(`💥 Sabotage broke the task streak! GIFT CARD REVOKED!`);
                    updated = updated.map(p => p.id === target.id ? { ...p, hand: p.hand.filter(c => c.type !== 'GIFT') } : p);
                 }
                 setPlayers(updated);
                 setCompletedTasks(newTasksMap);
                 addLog(`💥 ${actor.name} sabotaged 1 task from ${target.name}!`);
                 advanceTurnQueue(updated, updatedPile);
             } else { advanceTurnQueue(currentPlayers, updatedPile); }
          }
          else setActiveModalFor('SABOTAGE_TARGET', pId);
        } else if (clueKey === 'CCTV') {
          playAudioFx('shield');
          const armedPlayers = currentPlayers.filter(p => p.id !== pId && p.isAlive && p.hand.some(c => c.type === 'KILL'));
          setActiveModalFor('CCTV_MODAL', pId, { armedPlayers });
          addLog(armedPlayers.length > 0 ? `📹 CCTV: Kill cards detected on ${armedPlayers.map(p=>p.name).join(', ')}!` : `📹 CCTV: No active Kill cards found!`);
        } else if (clueKey === 'EYES_ON_YOU') {
          setCenterPileBlocked(true); addLog(`👁️ "Eyes On You": Center Pile blocked!`); advanceTurnQueue(currentPlayers, updatedPile);
        } else if (clueKey === 'CHANGE_PLAN') {
          playAudioFx('card');
          const hands = currentPlayers.map(p => p.hand);
          const newPlayers = currentPlayers.map((p, i) => ({ ...p, hand: hands[(i - 1 + hands.length) % hands.length] }));
          addLog(`🔄 Change of Plan! Everyone passes hands right!`);
          setPlayers(newPlayers); advanceTurnQueue(newPlayers, updatedPile);
        }
      };

      const resolveShowMeTargetSelect = (targetPId) => {
        const target = players.find(p => p.id === targetPId); playAudioFx('card');
        addLog(`📢 "Show Me": Revealing ${target.name}'s hand.`);
        setActiveModalFor('VISUAL_CARD_PEEK', activePlayer.id, { title: `Revealed: ${target.name}'s Hand`, cards: target.hand, isCenter: false });
      };

      const resolveNeedingTargetSelect = (targetPId) => {
        const target = players.find(p => p.id === targetPId);
        setActiveModalFor('STEAL_CARD_MODAL', activePlayer.id, { target });
      };

      const resolveStealSpecificCard = (stolenCard, targetPId) => {
        const updated = players.map(p => {
          if (p.id === targetPId) return { ...p, hand: p.hand.filter(c => c.id !== stolenCard.id) };
          if (p.id === activePlayer.id) return { ...p, hand: [...p.hand, stolenCard] };
          return p;
        });
        playAudioFx('card'); setPlayers(updated);
        addLog(`🪝 Stole [${stolenCard.name}] from ${getPlayerName(targetPId)}!`);
        setActiveModalFor(null, null); advanceTurnQueue(updated);
      };

      const resolveStealGiftCard = (targetPId) => {
        setGiftCardHolder(activePlayer.id); playAudioFx('win');
        addLog(`🪝 STOLE THE GIFT CARD from ${getPlayerName(targetPId)}!`);
        
        const updated = players.map(p => {
          if (p.id === targetPId) return { ...p, hand: p.hand.filter(c => c.type !== 'GIFT') };
          if (p.id === activePlayer.id) return { ...p, hand: [...p.hand, { id: `gift_${Math.random()}`, type: 'GIFT', name: 'Gift Card', desc: 'Auto-win for Killer, free Antik for Safe.' }] };
          return p;
        });
        
        setPlayers(updated);
        setActiveModalFor(null, null); advanceTurnQueue(updated);
      };

      const handleSabotageTargetSelect = (targetPId) => {
        const targetTasks = completedTasks[targetPId] || [];
        const removed = targetTasks.slice(0, Math.min(2, targetTasks.length));
        const remaining = targetTasks.slice(Math.min(2, targetTasks.length));
        setActiveModalFor('SABOTAGE_REDISTRIBUTE', activePlayer.id, { targetPId, removed, remaining });
      };

      const resolveSabotageRedistribute = (recipientPId) => {
        const { targetPId, removed, remaining } = modalData;
        const newTasksMap = { ...completedTasks, [targetPId]: remaining, [recipientPId]: [...(completedTasks[recipientPId] || []), ...removed] };
        
        let updatedPlayers = [...players];
        if (remaining.length < 4 && Number(giftCardHolder) === targetPId) { 
           setGiftCardHolder(null); 
           addLog(`💥 Sabotage broke the task streak! GIFT CARD REVOKED!`); 
           updatedPlayers = updatedPlayers.map(p => p.id === targetPId ? { ...p, hand: p.hand.filter(c => c.type !== 'GIFT') } : p);
        }
        
        setPlayers(updatedPlayers);
        setCompletedTasks(newTasksMap); 
        addLog(`💥 Sabotage: Moved ${removed.length} tasks from ${getPlayerName(targetPId)} to ${getPlayerName(recipientPId)}!`);
        setActiveModalFor(null, null); advanceTurnQueue(updatedPlayers);
      };

      const handleAntikPlay = (pId, card, currentPlayers, updatedPile) => {
        const actor = currentPlayers.find(p => p.id === pId);
        if (actor.role === 'KILLER') {
          playAudioFx('kill'); addLog(`🚨 RULE ENFORCED: ${actor.name} (KILLER) played Antik and is ELIMINATED!`);
          const updated = eliminateAndDistributeCards(pId, currentPlayers);
          setPlayers(updated); if (!checkWinConditions(updated)) advanceTurnQueue(updated, updatedPile);
          return;
        }
        if (actor.isBot) {
          const target = currentPlayers.find(p => p.id !== pId && p.isAlive);
          if (target) resolveAntikAccusation(pId, target.id, currentPlayers);
        } else { setActiveModalFor('ANTIK', pId); }
      };

      const resolveAntikAccusation = (accuserId, targetId, currentPlayers) => {
        const target = currentPlayers.find(p => p.id === targetId);
        addLog(`🕵️ Antik Verdict: ${getPlayerName(accuserId)} accuses ${target.name}!`);

        if (target.role === 'KILLER') {
          playAudioFx('win'); addLog(`🎯 CORRECT! ${target.name} was a KILLER!`);
          const updated = eliminateAndDistributeCards(targetId, currentPlayers);
          setPlayers(updated); setActiveModalFor(null, null);
          if (!checkWinConditions(updated)) advanceTurnQueue(updated);
        } else {
          playAudioFx('kill'); addLog(`❌ WRONG! ${target.name} was SAFE. Killer team wins!`);
          setActiveModalFor(null, null); triggerGameOver('KILLER', currentPlayers);
        }
      };

      const handleGiftPlay = (pId, card, currentPlayers, updatedPile) => {
        const actor = currentPlayers.find(p => p.id === pId);
        addLog(`🎁 ${actor.name} activates GIFT CARD!`);
        if (actor.role === 'KILLER') { playAudioFx('win'); triggerGameOver('KILLER', currentPlayers); }
        else {
          if (actor.isBot) {
            const target = currentPlayers.find(p => p.id !== pId && p.isAlive);
            if (target) resolveAntikAccusation(pId, target.id, currentPlayers);
          } else setActiveModalFor('ANTIK', pId);
        }
      };

      const finalizeResolution = (pileToResolve, currentPlayers) => {
        setActiveModalFor(null, null);
        let updatedPlayers = [...currentPlayers];
        let newTasksMap = { ...completedTasks };

        const tasksInPile = pileToResolve.filter(c => c.type === 'TASK');
        const killsInPile = pileToResolve.filter(c => c.type === 'KILL');
        const shieldsInPile = pileToResolve.filter(c => c.type === 'SHIELD');

        tasksInPile.forEach(tCard => {
          const targetPId = tCard.targetPlayer;
          const currentList = newTasksMap[targetPId] || [];
          if (!currentList.some(t => t.id === tCard.id)) {
            const updated = [...currentList, tCard]; newTasksMap[targetPId] = updated;
            addLog(`✅ ${getPlayerName(targetPId)} completed a Task!`);
            if (updated.length >= 4 && giftCardHolder === null) {
              setGiftCardHolder(targetPId); playAudioFx('win'); addLog(`🎁 ${getPlayerName(targetPId)} secured 4 Tasks and earned the GIFT CARD!`);
              updatedPlayers = updatedPlayers.map(p => p.id === targetPId ? { ...p, hand: [...p.hand, { id: `gift_${Math.random()}`, type: 'GIFT', name: 'Gift Card', desc: 'Auto-win for Killer, free Antik for Safe.' }] } : p);
            }
          }
        });
        setCompletedTasks(newTasksMap);

        let availableShields = shieldsInPile.length;
        const validKills = killsInPile.filter(kCard => updatedPlayers.find(p => p.id === kCard.targetPlayer)?.isAlive);
        
        if (validKills.length > 0) {
          if (availableShields >= validKills.length) {
            validKills.forEach(k => addLog(`🛡️ Shield blocked Kill on ${getPlayerName(k.targetPlayer)}!`));
          } else {
            const shuffledKills = [...validKills].sort(() => Math.random() - 0.5);
            shuffledKills.slice(0, availableShields).forEach(k => addLog(`🛡️ Shield blocked Kill on ${getPlayerName(k.targetPlayer)}!`));
            shuffledKills.slice(availableShields).forEach(kCard => {
              const target = updatedPlayers.find(p => p.id === kCard.targetPlayer);
              if (target && target.isAlive) {
                playAudioFx('kill'); addLog(`🗡️ ${target.name} ASSASSINATED! Role: ${target.role}`);
                updatedPlayers = eliminateAndDistributeCards(target.id, updatedPlayers);
              }
            });
          }
        }

        setPlayers(updatedPlayers);
        if (checkWinConditions(updatedPlayers)) return;

        const survivingPlayers = updatedPlayers.filter(p => p.isAlive);
        const nextStartIdx = (roundStartingIndex + 1) % survivingPlayers.length;
        setRoundStartingIndex(nextStartIdx);

        const newQueue = [];
        for (let i = 0; i < survivingPlayers.length; i++) newQueue.push(survivingPlayers[(nextStartIdx + i) % survivingPlayers.length].id);

        updatedPlayers = updatedPlayers.map(p => {
          if (!p.isAlive) return p;
          let cH = [...p.hand]; let cD = [...p.deck];
          while (cH.length < 3 && cD.length > 0) cH.push(cD.shift());
          return { ...p, hand: cH, deck: cD };
        });

        setPlayers(updatedPlayers); setTurnQueue(newQueue); setQueueIndex(0); setCurrentRound(prev => prev + 1);
        setCenterPile([]); setCenterPileBlocked(false); addLog(`🔄 --- Round ${currentRound + 1} Deployed ---`);
      };

      const checkWinConditions = (currentPlayers) => {
        const alive = currentPlayers.filter(p => p.isAlive);
        const aliveKillers = alive.filter(p => p.role === 'KILLER');
        const aliveSafe = alive.filter(p => p.role === 'SAFE');
        if (aliveKillers.length === 0) { triggerGameOver('SAFE', currentPlayers); return true; }
        if (aliveSafe.length === 0 || aliveKillers.length >= aliveSafe.length) { triggerGameOver('KILLER', currentPlayers); return true; }
        return false;
      };

      const triggerGameOver = (winnerTeam, currentPlayers) => {
        playAudioFx('win'); setGameWinner(winnerTeam); setGameState('GAME_OVER'); addLog(`🏆 ${winnerTeam} WINS!`);
        try { confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } }); } catch (e) {}
      };

      const otherPlayers = players.filter(p => p.id !== myId);

      return (
        <div className="h-full w-full flex flex-col justify-between bg-zinc-950 shadow-2xl relative overflow-hidden xl:border-x border-zinc-800">
          
          {gameState === 'MENU' && (
            <div className="flex-1 p-6 flex flex-col justify-center items-center text-center overflow-y-auto">
              <div className="inline-block p-4 rounded-3xl bg-red-950/60 border border-red-700/80 mb-2 w-max">
                <span className="text-5xl md:text-7xl font-black text-red-500 tracking-tighter">K?</span>
              </div>
              <h1 className="text-2xl md:text-4xl font-black text-white tracking-tight mb-8">THE CARD GAME</h1>

              <div className="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-3xl p-6 md:p-8 text-left shadow-xl transition-all relative overflow-hidden">
                
                {networkMode === 'SOLO' && !roomCode ? (
                  <div className="space-y-6 animate-fade-in-up">
                    <div>
                      <label className="text-xs md:text-sm font-bold text-zinc-400 uppercase block mb-2">Total Participants: <span className="text-red-500">{playerCount}</span></label>
                      <input type="range" min="4" max="10" value={playerCount} onChange={e => setPlayerCount(Number(e.target.value))} className="w-full accent-red-600 h-2 bg-zinc-800 rounded-lg cursor-pointer" />
                      <p className="text-[10px] text-zinc-500 mt-2">Empty slots will be filled with Bot players automatically.</p>
                    </div>
                    <div className="border-t border-zinc-800 pt-5">
                      <button onClick={hostRoom} className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black text-sm md:text-base rounded-xl shadow-lg active:scale-95 transition-all">
                        CREATE LOBBY
                      </button>
                    </div>
                    <div className="flex space-x-2 pt-2 border-t border-zinc-800">
                      <input type="text" placeholder="K1234" value={joinCode} onChange={e => setJoinCode(e.target.value)} className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 text-sm md:text-base text-white uppercase text-center font-mono tracking-widest" />
                      <button onClick={joinRoom} className="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 font-bold rounded-xl text-white border border-zinc-700 text-sm md:text-base">JOIN</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6 animate-fade-in-up">
                    <div className="text-center">
                      <div className="text-xs md:text-sm font-bold text-zinc-400 uppercase mb-2">Room Code</div>
                      <div className="text-4xl md:text-5xl font-mono font-black text-red-500 bg-zinc-950 border border-zinc-800 py-3 rounded-2xl tracking-widest shadow-inner">
                        {roomCode}
                      </div>
                    </div>

                    {networkMode === 'HOST' && (
                      <div>
                        <label className="text-xs md:text-sm font-bold text-zinc-400 uppercase block mb-2 flex justify-between">
                          <span>Lobby Size: <span className="text-red-500">{playerCount}</span></span>
                        </label>
                        <input type="range" min="4" max="10" value={playerCount} onChange={e => setPlayerCount(Number(e.target.value))} className="w-full accent-red-600 h-2 bg-zinc-800 rounded-lg cursor-pointer" />
                      </div>
                    )}

                    <div className="bg-zinc-950 border border-zinc-800 p-4 rounded-2xl text-left space-y-2">
                      <div className="text-xs font-bold text-zinc-500 tracking-wider mb-2">CONNECTED PLAYERS:</div>
                      {players.map(p => (
                        <div key={p.id} className="text-white font-semibold flex items-center gap-3 text-sm">
                          <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> {p.name} {p.id === myId && <span className="text-zinc-500 text-xs">(You)</span>}
                        </div>
                      ))}
                      <div className="text-[10px] text-zinc-500 italic mt-2 pt-2 border-t border-zinc-900">
                        {playerCount - players.length > 0 ? `+ ${playerCount - players.length} Bots will be added` : 'Lobby is full!'}
                      </div>
                    </div>

                    {networkMode === 'HOST' ? (
                      <button onClick={() => startGame('HOST')} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base rounded-xl shadow-lg active:scale-95 transition-all">
                        ENTER GAME ⚡
                      </button>
                    ) : (
                      <div className="text-center py-4 bg-zinc-800 rounded-xl border border-zinc-700">
                        <p className="text-amber-400 text-sm font-bold animate-pulse">Waiting for host to launch...</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {(gameState === 'PLAYING' || gameState === 'RESOLVING') && (
            <div className="flex-1 flex flex-col relative w-full h-full bg-zinc-950 p-3 md:p-6 lg:p-8 overflow-hidden">
              
              <div className="flex justify-between items-center bg-zinc-900 border border-zinc-800 rounded-2xl p-3 md:p-4 shadow-md z-20 shrink-0 max-w-5xl mx-auto w-full">
                <span className="px-4 py-1.5 bg-red-950 border border-red-800 text-red-400 text-xs md:text-sm font-black rounded-lg">Round {currentRound}</span>
                <span className={`text-xs md:text-sm font-black uppercase px-6 py-2 rounded-full border ${activePlayer?.id === myId ? 'active-turn-glow text-white bg-red-900' : 'border-zinc-700 text-amber-400 bg-zinc-800'}`}>
                  {activePlayer?.name || 'Waiting'}'s Turn
                </span>
                <span className={`px-4 py-1.5 rounded-lg text-[10px] md:text-xs font-black border flex items-center gap-2 ${myPlayer?.role === 'KILLER' ? 'bg-red-950 text-red-400 border-red-800' : 'bg-blue-950 text-blue-400 border-blue-800'}`}>
                  <span className={`w-2 h-2 rounded-full ${myPlayer?.role === 'KILLER' ? 'bg-red-500' : 'bg-blue-500'}`}></span>
                  {myPlayer?.role || 'SAFE'}
                </span>
              </div>

              <div className="flex-1 overflow-y-auto flex flex-col w-full min-h-0 pt-4 pb-4 scroll-smooth">
                {botThinkingStatus && <div className="mb-3 text-center text-xs md:text-sm font-bold text-red-400 animate-pulse shrink-0">🤖 {botThinkingStatus}</div>}
                
                <div className="w-full max-w-2xl mx-auto mb-4 bg-zinc-900/60 border border-zinc-800 rounded-xl p-3 max-h-[80px] overflow-y-auto text-[10px] md:text-xs font-mono text-zinc-300 shrink-0 shadow-inner">
                  {turnLogs.map((l, i) => <div key={i} className="truncate py-0.5">{l}</div>)}
                </div>

                <div className="flex justify-center flex-wrap gap-2 md:gap-6 z-10 shrink-0 px-2 max-w-6xl mx-auto w-full">
                  {otherPlayers.map(p => (
                    <div key={p.id} className={`flex flex-col items-center p-2 md:p-3 w-24 md:w-32 rounded-xl border-2 transition-all ${!p.isAlive ? 'bg-zinc-950/60 border-zinc-900 opacity-50' : p.id === activePlayer?.id ? 'bg-zinc-900 border-red-500 shadow-[0_0_20px_rgba(220,38,38,0.4)] scale-105' : 'bg-zinc-900/70 border-zinc-700'}`}>
                      <div className="text-[10px] md:text-sm font-black truncate w-full text-center text-zinc-100">{p.name || 'Unknown'}</div>
                      {p.isAlive ? (
                        <div className="flex gap-2 mt-2 text-[9px] md:text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300 shadow-inner w-full justify-center">
                          <span>✋ {p.hand?.length || 0}</span> <span>🂠 {p.deck?.length || 0}</span>
                        </div>
                      ) : <div className="text-[9px] md:text-xs font-black text-red-500 mt-2">DEAD ({p.role ? p.role[0] : '?'})</div>}
                      <div className="text-[9px] md:text-xs font-bold text-amber-400 mt-2 border-t border-zinc-800/80 w-full text-center pt-2">
                        {(completedTasks[p.id] || []).length}/4 Tasks
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex-1 flex items-center justify-center relative z-10 mt-6 min-h-[160px] shrink-0">
                  <div onClick={() => { if(centerPile.length > 0) dispatchAction('TRIGGER_REVEAL', {}); }} className="w-28 h-40 md:w-36 md:h-52 bg-gradient-to-br from-zinc-800 to-zinc-900 border-[3px] border-red-600 rounded-2xl shadow-xl flex flex-col items-center justify-center cursor-pointer hover:scale-105 md:hover:scale-110 transition-transform">
                    <span className="text-5xl md:text-6xl font-black text-red-500 drop-shadow-md">{centerPile?.length || 0}</span>
                    <span className="text-[10px] md:text-sm font-black text-zinc-500 uppercase mt-2">Center Pile</span>
                    {centerPileBlocked && <div className="absolute -bottom-5 bg-red-950 text-red-400 text-[9px] md:text-xs font-black px-3 py-1 rounded-full border border-red-800 shadow-lg">🚫 BLOCKED</div>}
                  </div>
                </div>
              </div>

              <div className="w-full z-20 flex flex-col gap-4 shrink-0 max-w-6xl mx-auto pt-2">
                {activePlayer?.id === myId && selectedCard && !activePlayer?.isBot && (
                  <div className="bg-zinc-900/95 border border-zinc-700 rounded-2xl p-4 shadow-[0_-10px_40px_rgba(0,0,0,0.6)] w-full max-w-md mx-auto animate-fade-in-up">
                    <div className="text-center text-xs md:text-sm font-bold text-amber-400 mb-3 truncate">Selected: <span className="text-white">{selectedCard.name}</span></div>
                    {['NOBEE', 'ANTIK', 'GIFT', 'CLUE'].includes(selectedCard.type) ? (
                      <button onClick={() => dispatchAction('PLAY_CARD', { pId: myId, card: selectedCard, dest: 'FACE_UP' })} className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black text-sm rounded-xl shadow-lg active:scale-95 transition-all">📢 PLAY FACE-UP EFFECT</button>
                    ) : (
                      <div className="grid grid-cols-2 gap-3">
                        <button disabled={centerPileBlocked} onClick={() => dispatchAction('PLAY_CARD', { pId: myId, card: selectedCard, dest: 'CENTER' })} className="py-3 bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 text-white font-bold text-sm rounded-xl shadow disabled:opacity-50 disabled:cursor-not-allowed transition-all">🂠 To Center</button>
                        <button onClick={() => dispatchAction('PLAY_CARD', { pId: myId, card: selectedCard, dest: 'NEXT_DECK' })} className="py-3 bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 text-white font-bold text-sm rounded-xl shadow transition-all">🤝 Pass Next</button>
                      </div>
                    )}
                  </div>
                )}

                <div className={`bg-zinc-900/80 border border-zinc-800 rounded-3xl p-4 md:p-6 shadow-xl transition-all ${myPlayer?.isAlive ? '' : 'opacity-40 grayscale'}`}>
                  <div className="flex justify-between items-center px-2 mb-4 max-w-3xl mx-auto w-full">
                    <span className="font-black text-sm md:text-base text-zinc-200">YOUR HAND</span>
                    <span className="text-xs md:text-sm font-bold text-zinc-400 bg-zinc-950 px-3 py-1 rounded-lg border border-zinc-800 shadow-inner">Tasks: {(completedTasks[myId] || []).length}/4</span>
                  </div>
                  
                  <div className="flex gap-3 md:gap-5 overflow-x-auto pb-4 px-2 md:justify-center w-full">
                    {(!myPlayer?.isAlive || (myPlayer?.hand || []).length === 0) ? (
                      <div className="text-zinc-500 italic text-sm md:text-base py-8 w-full text-center">Empty hand or eliminated.</div>
                    ) : (
                      myPlayer.hand.map(card => (
                        <div key={card.id} onClick={() => { if(activePlayer?.id === myId) setSelectedCard(card); playAudioFx('card'); }} className={`w-32 md:w-40 flex-shrink-0 transition-transform ${selectedCard?.id === card.id ? 'md:-translate-y-4 -translate-y-2' : ''}`}>
                          <VisualCard card={card} isSelected={selectedCard?.id === card.id} />
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeModal === 'NOBEE_CHOICE' && modalOwnerId === myId && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-purple-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">🔍</div><h3 className="text-2xl font-black text-purple-400 mb-6 shrink-0">Assistant's Nobee</h3>
                
                <div className="flex-1 overflow-y-auto space-y-4 pr-2 text-left">
                  <div>
                    <div className="text-xs font-bold text-zinc-500 uppercase mb-3 tracking-wider text-center">Inspect Player Hands:</div>
                    <div className="space-y-2">
                      {players.filter(p => p.id !== myId && p.isAlive).map(p => (
                        <button key={`hand_${p.id}`} onClick={() => dispatchAction('RESOLVE_NOBEE', { targetPId: p.id, mode: 'HAND' })} className="w-full py-3.5 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-sm font-bold text-white flex justify-between items-center transition-all">
                          <span>{p.name}'s Hand</span> <span className="text-purple-400 text-xs bg-zinc-950 px-2 py-1 rounded">{p.hand?.length || 0} Cards</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <div className="border-t border-zinc-800 pt-4">
                    <div className="text-xs font-bold text-zinc-500 uppercase mb-3 tracking-wider text-center">Inspect Player Decks:</div>
                    <div className="space-y-2">
                      {players.filter(p => p.id !== myId && p.isAlive).map(p => (
                        <button key={`deck_${p.id}`} onClick={() => dispatchAction('RESOLVE_NOBEE', { targetPId: p.id, mode: 'DECK' })} className="w-full py-3.5 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-sm font-bold text-white flex justify-between items-center transition-all">
                          <span>{p.name}'s Deck</span> <span className="text-purple-400 text-xs bg-zinc-950 px-2 py-1 rounded">{p.deck?.length || 0} Cards</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full mt-6 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold text-sm rounded-xl transition-colors shrink-0">Cancel Scan</button>
              </div>
            </div>
          )}

          {activeModal === 'VISUAL_CARD_PEEK' && modalOwnerId === myId && modalData && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 md:p-8">
              <div className="bg-zinc-900 border border-purple-600/80 w-full max-w-2xl rounded-3xl p-6 md:p-8 flex flex-col max-h-[90vh] shadow-2xl">
                <div className="text-center mb-6 shrink-0"><div className="text-4xl mb-2">👁️</div><h3 className="text-xl md:text-2xl font-black text-purple-400">{modalData.title}</h3></div>
                <div className="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-5 mb-6 p-2">
                  {modalData.cards?.map((c, i) => <VisualCard key={c?.id || i} card={c} extraBadge={modalData.isCenter ? `From ${getPlayerName(c?.playedBy)}` : null} />)}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-4 bg-gradient-to-r from-purple-600 to-red-600 hover:opacity-90 text-white font-black text-sm md:text-base rounded-2xl shadow-xl active:scale-95 transition-all shrink-0">DONE INSPECTING ⚡</button>
              </div>
            </div>
          )}

          {activeModal === 'SHOW_ME_TARGET' && modalOwnerId === myId && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-cyan-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">📢</div><h3 className="text-2xl font-black text-cyan-400 mb-6 shrink-0">Show Me What You Got!</h3>
                <div className="flex-1 space-y-3 mb-4 overflow-y-auto pr-2">
                  {players.filter(p => p.id !== myId && p.isAlive && p.hand?.length > 0).map(p => (
                    <button key={p.id} onClick={() => dispatchAction('RESOLVE_SHOW_ME', { targetPId: p.id })} className="w-full py-4 px-5 bg-zinc-800 hover:bg-cyan-950/60 border border-zinc-700 rounded-xl text-sm font-black text-white flex justify-between items-center transition-all">
                      <span>{p.name}</span> <span className="text-cyan-400 font-bold bg-cyan-950 px-2 py-1 rounded text-xs">{p.hand?.length || 0} Cards</span>
                    </button>
                  ))}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold text-sm rounded-xl transition-colors shrink-0">Cancel</button>
              </div>
            </div>
          )}

          {activeModal === 'NEEDING_TARGET' && modalOwnerId === myId && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-amber-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">🪝</div><h3 className="text-2xl font-black text-amber-400 mb-6 shrink-0">I'll Be Needing That!</h3>
                <div className="flex-1 space-y-3 mb-4 overflow-y-auto pr-2">
                  {players.filter(p => p.id !== myId && p.isAlive && (p.hand?.length > 0 || Number(giftCardHolder) === p.id)).map(p => (
                    <button key={p.id} onClick={() => dispatchAction('RESOLVE_NEEDING', { targetPId: p.id })} className="w-full py-4 px-5 bg-zinc-800 hover:bg-amber-950/60 border border-zinc-700 rounded-xl text-sm font-black text-white flex justify-between items-center transition-all">
                      <span>{p.name}</span> <span className="text-amber-400 font-bold bg-amber-950/50 px-2 py-1 rounded text-xs">{Number(giftCardHolder) === p.id ? '🎁 Holds Gift Card!' : `${p.hand?.length || 0} Cards`}</span>
                    </button>
                  ))}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold text-sm rounded-xl transition-colors shrink-0">Cancel</button>
              </div>
            </div>
          )}

          {activeModal === 'STEAL_CARD_MODAL' && modalOwnerId === myId && modalData && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 md:p-8">
              <div className="bg-zinc-900 border border-amber-500/80 w-full max-w-2xl rounded-3xl p-6 md:p-8 flex flex-col max-h-[90vh] shadow-2xl">
                <div className="text-center mb-6 shrink-0"><div className="text-4xl mb-2">🪝</div><h3 className="text-xl md:text-2xl font-black text-amber-400">Steal from {modalData.target?.name || 'Unknown'}</h3></div>
                {Number(giftCardHolder) === modalData.target?.id && (
                  <button onClick={() => dispatchAction('STEAL_GIFT', { targetPId: modalData.target.id })} className="w-full py-4 mb-6 bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-black text-sm md:text-base rounded-xl flex justify-center gap-3 transition-transform active:scale-95 shadow-lg shrink-0"><span>🎁</span> STEAL THE GIFT CARD DIRECTLY!</button>
                )}
                <div className="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-5 mb-6 p-2">
                  {modalData.target?.hand?.map((c, i) => <VisualCard key={c?.id || i} card={c} onClick={() => dispatchAction('STEAL_SPECIFIC', { card: c, targetPId: modalData.target.id })} />)}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold text-sm rounded-xl transition-colors shrink-0">Cancel</button>
              </div>
            </div>
          )}

          {activeModal === 'CCTV_MODAL' && modalOwnerId === myId && modalData && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-red-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">📹</div><h3 className="text-2xl font-black text-red-500 mb-6 shrink-0">CCTV Scan Results</h3>
                <div className="flex-1 overflow-y-auto mb-6 pr-2">
                  {modalData.armedPlayers?.length > 0 ? (
                    <div className="space-y-3">
                      {modalData.armedPlayers.map(p => (
                        <div key={p.id} className="p-4 bg-red-950/60 border border-red-800 rounded-xl flex justify-between items-center text-sm font-bold text-white">
                          <span>{p.name}</span><span className="text-red-400 text-[10px] md:text-xs font-black uppercase px-3 py-1 bg-red-900/80 rounded-full">HOLDING KILL CARD 🗡️</span>
                        </div>
                      ))}
                    </div>
                  ) : <div className="p-5 bg-zinc-800/80 border border-zinc-700 rounded-xl text-sm font-bold text-emerald-400">✅ Safe! No other players are currently holding Kill cards.</div>}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black text-sm rounded-xl shadow-lg transition-transform active:scale-95 shrink-0">CONTINUE GAME ⚡</button>
              </div>
            </div>
          )}

          {activeModal === 'SABOTAGE_TARGET' && modalOwnerId === myId && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-amber-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">💥</div><h3 className="text-2xl font-black text-amber-500 mb-6 shrink-0">Sabotage Target</h3>
                <div className="flex-1 space-y-3 mb-4 overflow-y-auto pr-2">
                  {players.filter(p => p.id !== myId && (completedTasks[p.id] || []).length >= 1).map(p => (
                    <button key={p.id} onClick={() => dispatchAction('SABOTAGE_TARGET', { targetPId: p.id })} className="w-full py-4 px-5 bg-zinc-800 hover:bg-amber-950/60 border border-zinc-700 rounded-xl text-sm font-black text-white flex justify-between items-center transition-all">
                      <span>{p.name}</span><span className="text-amber-400 bg-amber-950/50 px-2 py-1 rounded text-xs">{(completedTasks[p.id] || []).length} Completed</span>
                    </button>
                  ))}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold text-sm rounded-xl transition-colors shrink-0">Cancel</button>
              </div>
            </div>
          )}

          {activeModal === 'SABOTAGE_REDISTRIBUTE' && modalOwnerId === myId && modalData && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-amber-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">🎁</div><h3 className="text-2xl font-black text-amber-500 mb-6 shrink-0">Redistribute Tasks</h3>
                <div className="flex-1 space-y-3 mb-4 overflow-y-auto pr-2">
                  {players.filter(p => p.id !== modalData.targetPId && p.isAlive).map(p => (
                    <button key={p.id} onClick={() => dispatchAction('SABOTAGE_REDISTRIBUTE', { recipientPId: p.id })} className="w-full py-4 px-5 bg-zinc-800 hover:bg-amber-950/60 border border-zinc-700 rounded-xl text-sm font-black text-white text-left transition-all">
                      Give {modalData.removed?.length || 0} Task(s) to {p.name}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {activeModal === 'ANTIK' && modalOwnerId === myId && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-red-600/60 w-full max-w-lg rounded-3xl p-6 md:p-8 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <div className="text-4xl mb-3 shrink-0">🕵️</div><h3 className="text-2xl font-black text-red-500 mb-6 shrink-0">Detective's Verdict</h3>
                <div className="flex-1 space-y-3 mb-6 overflow-y-auto pr-2">
                  {players.filter(p => p.id !== myId && p.isAlive).map(p => (
                    <button key={p.id} onClick={() => dispatchAction('ANTIK_ACCUSE', { accuserId: myId, targetId: p.id })} className="w-full py-4 px-5 bg-zinc-800 hover:bg-red-950/60 border border-zinc-700 rounded-xl text-sm font-black text-white text-left transition-all">
                      Accuse {p.name}
                    </button>
                  ))}
                </div>
                <button onClick={() => dispatchAction('CLOSE_MODAL', {})} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold text-sm rounded-xl transition-colors shrink-0">Cancel</button>
              </div>
            </div>
          )}

          {activeModal === 'REVEAL_ANIM' && (modalOwnerId === 'ALL') && modalData && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center">
              <h2 className="text-sm font-bold text-red-500 uppercase tracking-widest mb-3 shrink-0">Round Reveal Phase</h2>
              <h1 className="text-3xl md:text-5xl font-black text-white mb-8 shrink-0">Center Pile Unveiled</h1>
              <div className="flex-1 overflow-y-auto w-full max-w-md pr-2 mb-10">
                {modalData.pile?.length > 0 ? (
                  <div className="space-y-3">
                    {modalData.pile.map((c, i) => (
                      <div key={i} className="p-4 md:p-5 bg-zinc-900 border border-red-600/50 rounded-xl flex justify-between items-center text-left card-flip-anim shadow-lg">
                        <div><div className="text-xs font-bold text-red-400 uppercase tracking-wider mb-1">{c?.type || '?'}</div><div className="text-sm md:text-base font-black text-white">{c?.name || '?'}</div></div>
                        <div className="text-2xl md:text-3xl">{c?.type === 'KILL' ? '🗡️' : c?.type === 'SHIELD' ? '🛡️' : c?.type === 'TASK' ? '✅' : '🃏'}</div>
                      </div>
                    ))}
                  </div>
                ) : <div className="text-base text-zinc-400 italic mt-10">No cards were played into the Center Pile this round!</div>}
              </div>
              {(networkMode === 'HOST' || networkMode === 'SOLO') && (
                <button onClick={() => dispatchAction('FINALIZE_ROUND', { pile: modalData.pile })} className="w-full max-w-md py-5 bg-red-600 hover:bg-red-500 text-white font-black text-base rounded-2xl shadow-xl active:scale-95 transition-all shrink-0">RESOLVE ROUND EFFECTS ⚡</button>
              )}
              {networkMode === 'JOIN' && <div className="text-amber-400 font-bold animate-pulse text-base shrink-0">Host is resolving round mechanics...</div>}
            </div>
          )}

          {gameState === 'GAME_OVER' && (
            <div className="fixed inset-0 bg-zinc-950 z-50 flex flex-col justify-between p-8 max-w-2xl mx-auto text-center shadow-2xl xl:border-x border-zinc-800">
              <div className="my-auto w-full">
                <div className="text-7xl mb-6">{gameWinner === 'SAFE' ? '🛡️' : '🗡️'}</div>
                <h1 className={`text-5xl md:text-6xl font-black mb-8 ${gameWinner === 'SAFE' ? 'text-emerald-400' : 'text-red-500'}`}>{gameWinner === 'SAFE' ? 'SAFE TEAM WINS!' : 'KILLER TEAM WINS!'}</h1>
                <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 md:p-8 my-8 text-left space-y-3 shadow-xl">
                  <div className="text-sm font-bold text-zinc-400 uppercase tracking-wider mb-4 text-center">Final Player Roles</div>
                  {players.map(p => (
                    <div key={p.id} className="flex justify-between items-center text-sm md:text-base py-2 border-b border-zinc-800/60 last:border-0">
                      <span className="font-bold text-white">{p.name}</span>
                      <span className={`font-black px-3 py-1 rounded bg-zinc-950 ${p.role === 'KILLER' ? 'text-red-500' : p.role === 'SAFE' ? 'text-emerald-400' : 'text-zinc-500'}`}>{p.role || 'UNKNOWN'}</span>
                    </div>
                  ))}
                </div>
              </div>
              <button onClick={() => window.location.reload()} className="w-full py-5 bg-red-600 hover:bg-red-500 text-white font-black text-lg rounded-2xl shadow-xl active:scale-95 transition-all">PLAY AGAIN 🔄</button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
