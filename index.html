<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K? The Card Game - Official Simulator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#dc2626',
              darkRed: '#7f1d1d',
              slate: '#09090b',
              cardBg: '#18181b',
              gold: '#f59e0b',
              emerald: '#10b981'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.9); }
    }
    .active-turn-glow { animation: pulseGlow 1.5s infinite ease-in-out; }

    @keyframes cardFlip {
      0% { transform: rotateY(90deg) scale(1.1); opacity: 0; }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    .card-flip-anim { animation: cardFlip 0.4s ease-out forwards; }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }

    .perspective-table {
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    .table-surface {
      transform: rotateX(55deg) translateY(-80px);
      box-shadow: 0 60px 120px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.8);
      background: radial-gradient(ellipse at center, #27272a 0%, #09090b 70%);
    }
    .opponent-mat {
      transform: translate(-50%, -50%) translateZ(10px) rotateX(-55deg);
    }
    .center-pile-3d {
      transform: translate(-50%, -50%) translateZ(25px) rotateX(-40deg);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-full w-full overflow-x-hidden font-sans antialiased select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playAudioFx = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'card') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'play') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'kill') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'shield') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.setValueAtTime(900, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const subOsc = ctx.createOscillator();
            const subGain = ctx.createGain();
            subOsc.connect(subGain);
            subOsc.connect(ctx.destination);
            subOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
            subGain.gain.setValueAtTime(0.2, now + idx * 0.1);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
            subOsc.start(now + idx * 0.1);
            subOsc.stop(now + idx * 0.1 + 0.3);
          });
        }
      } catch (e) {}
    };

    const eliminateAndDistributeCards = (eliminatedPId, playerList) => {
      const victim = playerList.find(p => p.id === eliminatedPId);
      if (!victim || !victim.isAlive) return playerList;

      const cardsToDistribute = [...(victim.hand || []), ...(victim.deck || [])];

      for (let i = cardsToDistribute.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cardsToDistribute[i], cardsToDistribute[j]] = [cardsToDistribute[j], cardsToDistribute[i]];
      }

      let updatedList = playerList.map(p => 
        p.id === eliminatedPId 
          ? { ...p, isAlive: false, revealedRole: true, hand: [], deck: [] } 
          : p
      );

      const survivors = updatedList.filter(p => p.isAlive);

      if (survivors.length > 0 && cardsToDistribute.length > 0) {
        cardsToDistribute.forEach((card, idx) => {
          const recipientId = survivors[idx % survivors.length].id;
          updatedList = updatedList.map(p => {
            if (p.id === recipientId) {
              return { ...p, deck: [card, ...p.deck] };
            }
            return p;
          });
        });
      }

      return updatedList;
    };

    const CLUE_TYPES = {
      CCTV: { name: 'I Saw The CCTV Footage', desc: 'Scans and reveals which players hold a Kill card in hand.' },
      SHOW_ME: { name: 'Show Me What You Got!', desc: 'Opens target player\'s hand cards for visual inspection.' },
      SABOTAGE: { name: 'Sabotage', desc: 'Revokes up to 2 completed tasks to break progress and revoke Gift Card.' },
      NEEDING: { name: "I'll Be Needing That", desc: 'Steal a specific card or Gift Card directly from target\'s hand.' },
      CHANGE_PLAN: { name: 'Change of Plan', desc: 'All players pass their current hand to the player on their right.' },
      EYES_ON_YOU: { name: 'I Have My Eyes on You!', desc: 'Blocks Center Pile plays for the rest of this round.' }
    };

    const generateDecks = (playerCount) => {
      let killerCount = 1;
      if (playerCount >= 6 && playerCount <= 8) killerCount = 2;
      if (playerCount >= 9) killerCount = 3;

      let roles = Array(killerCount).fill('KILLER').concat(Array(playerCount - killerCount).fill('SAFE'));
      for (let i = roles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roles[i], roles[j]] = [roles[j], roles[i]];
      }

      let mainDeck = [];

      for (let p = 1; p <= playerCount; p++) {
        for (let t = 1; t <= 4; t++) {
          mainDeck.push({
            id: `task_${p}_${t}_${Math.random()}`,
            type: 'TASK',
            targetPlayer: p,
            taskNum: t,
            name: `Player ${p} Task ${t}`,
            desc: `Counts toward Player ${p}'s required 4 tasks.`
          });
        }
      }

      for (let p = 1; p <= playerCount; p++) {
        for (let k = 1; k <= 2; k++) {
          mainDeck.push({
            id: `kill_${p}_${k}_${Math.random()}`,
            type: 'KILL',
            targetPlayer: p,
            name: `Player ${p} Kill Card`,
            desc: `Attacks Player ${p} unless blocked by a Shield Card.`
          });
        }
      }

      for (let p = 1; p <= playerCount; p++) {
        mainDeck.push({ id: `shield_${p}_${Math.random()}`, type: 'SHIELD', name: 'Shield Card', desc: 'Blocks 1 Kill Card attack in Center Pile.' });
        mainDeck.push({ id: `nobee_${p}_${Math.random()}`, type: 'NOBEE', name: "Assistant's Nobee", desc: "Visually inspect target's full hand or inspect the Center Pile." });
      }

      let antikCount = playerCount <= 5 ? 1 : (playerCount <= 8 ? 2 : 3);
      for (let a = 1; a <= antikCount; a++) {
        mainDeck.push({ id: `antik_${a}_${Math.random()}`, type: 'ANTIK', name: "Detective's Antik", desc: "Make a high-stakes accusation against a suspected Killer!" });
      }

      const clueKeys = Object.keys(CLUE_TYPES);
      let clueCount = playerCount === 4 ? 3 : (playerCount <= 6 ? 4 : (playerCount === 7 ? 5 : (playerCount <= 9 ? 6 : 7)));
      for (let c = 0; c < clueCount; c++) {
        const cKey = clueKeys[c % clueKeys.length];
        mainDeck.push({
          id: `clue_${c}_${Math.random()}`,
          type: 'CLUE',
          clueKey: cKey,
          name: CLUE_TYPES[cKey].name,
          desc: CLUE_TYPES[cKey].desc
        });
      }

      for (let i = mainDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mainDeck[i], mainDeck[j]] = [mainDeck[j], mainDeck[i]];
      }

      const playerDecks = {};
      const playerHands = {};

      for (let p = 1; p <= playerCount; p++) {
        const pDeck = mainDeck.splice(0, 9);
        const pHand = pDeck.splice(0, 3);
        playerDecks[p] = pDeck;
        playerHands[p] = pHand;
      }

      return { roles, playerDecks, playerHands };
    };

    function VisualCard({ card, onClick, isSelected, showTarget = true, extraBadge }) {
      const getTypeStyle = (type) => {
        switch(type) {
          case 'TASK': return { badge: 'bg-emerald-950 text-emerald-400 border-emerald-800', border: 'border-emerald-600/60', icon: '✅' };
          case 'KILL': return { badge: 'bg-red-950 text-red-400 border-red-800', border: 'border-red-600/80', icon: '🗡️' };
          case 'SHIELD': return { badge: 'bg-blue-950 text-blue-400 border-blue-800', border: 'border-blue-600/60', icon: '🛡️' };
          case 'NOBEE': return { badge: 'bg-purple-950 text-purple-400 border-purple-800', border: 'border-purple-600/60', icon: '🔍' };
          case 'ANTIK': return { badge: 'bg-amber-950 text-amber-400 border-amber-800', border: 'border-amber-600/80', icon: '🕵️' };
          case 'CLUE': return { badge: 'bg-cyan-950 text-cyan-400 border-cyan-800', border: 'border-cyan-600/60', icon: '💡' };
          case 'GIFT': return { badge: 'bg-yellow-950 text-yellow-300 border-yellow-600', border: 'border-yellow-500', icon: '🎁' };
          default: return { badge: 'bg-zinc-800 text-zinc-300 border-zinc-700', border: 'border-zinc-700', icon: '🃏' };
        }
      };

      const style = getTypeStyle(card.type);

      return (
        <div
          onClick={onClick}
          className={`p-3 rounded-2xl border flex flex-col justify-between h-36 relative transition-all ${
            onClick ? 'cursor-pointer active:scale-95' : ''
          } ${
            isSelected 
              ? 'bg-red-950/80 border-red-500 ring-2 ring-red-500 scale-[1.02] shadow-lg shadow-red-900/40' 
              : `bg-zinc-900/90 ${style.border}`
          }`}
        >
          <div className="flex justify-between items-start">
            <span className={`text-[9px] font-black uppercase px-2 py-0.5 rounded-full border ${style.badge}`}>
              {card.type}
            </span>
            <span className="text-base">{style.icon}</span>
          </div>

          <div className="my-1">
            <div className="text-xs font-black text-white leading-tight line-clamp-2">
              {card.name}
            </div>
            {showTarget && card.targetPlayer && (
              <div className="text-[10px] font-bold text-red-400 mt-0.5">
                Target: Player {card.targetPlayer}
              </div>
            )}
          </div>

          <div className="text-[9.5px] text-zinc-400 leading-tight line-clamp-2">
            {card.desc}
          </div>

          {extraBadge && (
            <div className="absolute -top-2 -right-2 bg-amber-500 text-black text-[9px] font-black px-2 py-0.5 rounded-full shadow">
              {extraBadge}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [gameState, setGameState] = useState('LOBBY');
      const [playerCount, setPlayerCount] = useState(4);
      const [isVsBots, setIsVsBots] = useState(true);

      const [players, setPlayers] = useState([]);
      const [roundStartingIndex, setRoundStartingIndex] = useState(0);
      const [turnQueue, setTurnQueue] = useState([]);
      const [queueIndex, setQueueIndex] = useState(0);
      const [currentRound, setCurrentRound] = useState(1);
      
      const [centerPile, setCenterPile] = useState([]);
      const [centerPileBlocked, setCenterPileBlocked] = useState(false);
      const [completedTasks, setCompletedTasks] = useState({});
      const [giftCardHolder, setGiftCardHolder] = useState(null);
      const [gameWinner, setGameWinner] = useState(null);

      const [selectedCard, setSelectedCard] = useState(null);
      const [turnLogs, setTurnLogs] = useState([]);
      const [botThinkingStatus, setBotThinkingStatus] = useState(null);
      
      const [activeModal, setActiveModal] = useState(null); 
      const [modalData, setModalData] = useState(null);

      const botTimeoutRef = useRef(null);

      const addLog = (msg) => setTurnLogs(prev => [msg, ...prev.slice(0, 49)]);

      useEffect(() => {
        return () => { if (botTimeoutRef.current) clearTimeout(botTimeoutRef.current); };
      }, []);

      const startGame = () => {
        playAudioFx('play');
        const { roles, playerDecks, playerHands } = generateDecks(playerCount);

        const newPlayers = [];
        const initTasks = {};

        for (let i = 1; i <= playerCount; i++) {
          newPlayers.push({
            id: i,
            name: isVsBots && i > 1 ? `Bot ${i} 🤖` : `Player ${i} 👤`,
            isBot: isVsBots && i > 1,
            role: roles[i - 1],
            isAlive: true,
            deck: playerDecks[i],
            hand: playerHands[i],
            revealedRole: false
          });
          initTasks[i] = [];
        }

        const initialQueue = newPlayers.filter(p => p.isAlive).map(p => p.id);

        setPlayers(newPlayers);
        setCompletedTasks(initTasks);
        setRoundStartingIndex(0);
        setTurnQueue(initialQueue);
        setQueueIndex(0);
        setCurrentRound(1);
        setCenterPile([]);
        setCenterPileBlocked(false);
        setGiftCardHolder(null);
        setGameWinner(null);
        setBotThinkingStatus(null);
        setTurnLogs([`🎮 Match started! ${playerCount} players. 3 cards in hand.`]);

        if (isVsBots) {
          setGameState('PLAYING');
        } else {
          setGameState('PRIVACY_PASS');
        }
      };

      const activePlayerId = turnQueue[queueIndex] || null;
      const activePlayer = players.find(p => p.id === activePlayerId) || null;

      useEffect(() => {
        if (gameState !== 'PLAYING' || !activePlayer || !activePlayer.isBot || activePlayer.isAlive === false) {
          return;
        }

        setBotThinkingStatus(`${activePlayer.name} is thinking...`);

        botTimeoutRef.current = setTimeout(() => {
          executeBotDecision(activePlayer);
        }, 1200);

        return () => {
          if (botTimeoutRef.current) clearTimeout(botTimeoutRef.current);
        };
      }, [gameState, queueIndex, turnQueue]);

      const executeBotDecision = (bot) => {
        const hand = bot.hand || [];
        if (hand.length === 0) {
          addLog(`🤖 ${bot.name} has no cards left and passes turn.`);
          advanceTurnQueue();
          return;
        }

        let cardToPlay = hand[0];
        let destination = 'CENTER';

        const playableSpecials = hand.filter(c => {
          if (c.type === 'ANTIK') {
            return bot.role === 'SAFE' && currentRound >= 3;
          }
          return ['NOBEE', 'CLUE', 'GIFT'].includes(c.type);
        });

        if (playableSpecials.length > 0 && Math.random() > 0.4) {
          cardToPlay = playableSpecials[Math.floor(Math.random() * playableSpecials.length)];
          destination = 'FACE_UP';
        } else if (bot.role === 'KILLER') {
          const killCard = hand.find(c => c.type === 'KILL');
          if (killCard && !centerPileBlocked) {
            cardToPlay = killCard;
            destination = 'CENTER';
          } else {
            destination = 'NEXT_DECK';
          }
        } else {
          const taskCard = hand.find(c => c.type === 'TASK');
          const shieldCard = hand.find(c => c.type === 'SHIELD');
          const killCard = hand.find(c => c.type === 'KILL');

          if (taskCard && !centerPileBlocked) {
            cardToPlay = taskCard;
            destination = 'CENTER';
          } else if (shieldCard && !centerPileBlocked) {
            cardToPlay = shieldCard;
            destination = 'CENTER';
          } else if (killCard) {
            cardToPlay = killCard;
            destination = 'NEXT_DECK';
          } else {
            destination = 'NEXT_DECK';
          }
        }

        executeCardPlay(bot.id, cardToPlay, destination);
      };

      const executeCardPlay = (playerId, card, destination) => {
        setBotThinkingStatus(null);
        playAudioFx('play');

        setPlayers(prev => prev.map(p => {
          if (p.id === playerId) {
            return { ...p, hand: p.hand.filter(c => c.id !== card.id) };
          }
          return p;
        }));

        const pObj = players.find(p => p.id === playerId);
        addLog(`🃏 ${pObj?.name} played ${card.name} (${destination === 'CENTER' ? 'Face-Down to Center' : destination === 'FACE_UP' ? 'Face-Up Special' : 'Passed to Next Deck'})`);

        if (destination === 'CENTER') {
          setCenterPile(prev => [...prev, { ...card, playedBy: playerId }]);
        } else if (destination === 'NEXT_DECK') {
          const aliveQueue = players.filter(p => p.isAlive).map(p => p.id);
          const currentIdx = aliveQueue.indexOf(playerId);
          const nextAliveId = aliveQueue[(currentIdx + 1) % aliveQueue.length];

          setPlayers(prev => prev.map(p => {
            if (p.id === nextAliveId) {
              return { ...p, deck: [card, ...p.deck] };
            }
            return p;
          }));
          addLog(`➡️ Card passed to Player ${nextAliveId}'s deck.`);
        } else if (destination === 'FACE_UP') {
          if (card.type === 'ANTIK') {
            triggerAntikAbility(playerId, card);
            return;
          } else if (card.type === 'CLUE') {
            triggerClueAbility(playerId, card);
            return;
          }
        }

        advanceTurnQueue();
      };

      const triggerAntikAbility = (accuserPId, card) => {
        setModalData({
          accuser: accuserPId,
          card,
          targets: players.filter(p => p.id !== accuserPId && p.isAlive)
        });
        setActiveModal('ANTIK_CHOICE');
      };

      const resolveAntikAccusation = (accuserPId, targetPId) => {
        setActiveModal(null);
        const targetPlayer = players.find(p => p.id === targetPId);
        const accuser = players.find(p => p.id === accuserPId);

        if (targetPlayer.role === 'KILLER') {
          playAudioFx('win');
          addLog(`🎉 SUCCESS! ${accuser.name} correctly accused Player ${targetPId} of being a Killer! Killer eliminated!`);
          
          let updatedPlayers = eliminateAndDistributeCards(targetPId, players);
          setPlayers(updatedPlayers);

          const killersLeft = updatedPlayers.filter(p => p.isAlive && p.role === 'KILLER').length;
          if (killersLeft === 0) {
            setGameWinner('SAFE');
            setGameState('GAME_OVER');
            return;
          }
        } else {
          playAudioFx('kill');
          addLog(`❌ FALSE ACCUSATION! ${accuser.name} wrongly accused Player ${targetPId} (who was Safe). Accuser eliminated!`);
          
          let updatedPlayers = eliminateAndDistributeCards(accuserPId, players);
          setPlayers(updatedPlayers);
        }

        advanceTurnQueue();
      };

      const triggerClueAbility = (playerId, card) => {
        const clueKey = card.clueKey;
        const clueInfo = CLUE_TYPES[clueKey];

        if (clueKey === 'CCTV') {
          const killersHoldingKill = players.map(p => {
            const hasKill = p.hand.some(c => c.type === 'KILL');
            return hasKill ? `Player ${p.id} (${p.name})` : null;
          }).filter(Boolean);

          alert(`💡 CCTV Footage Results:\nPlayers currently holding a Kill Card in hand:\n${killersHoldingKill.length ? killersHoldingKill.join(', ') : 'None detected!'}`);
          advanceTurnQueue();
        } else {
          setModalData({ playerId, card, clueKey });
          setActiveModal('CLUE_TARGET');
        }
      };

      const resolveClueTarget = (playerId, targetPId) => {
        setActiveModal(null);
        const target = players.find(p => p.id === targetPId);
        alert(`💡 Clue Inspection on Player ${targetPId}:\nHand count: ${target.hand.length} cards.\nRoles/Cards inspected successfully.`);
        advanceTurnQueue();
      };

      const advanceTurnQueue = () => {
        setSelectedCard(null);
        const nextIdx = queueIndex + 1;

        if (nextIdx >= turnQueue.length) {
          resolveRoundEnd();
        } else {
          setQueueIndex(nextIdx);
        }
      };

      const resolveRoundEnd = () => {
        addLog(`🔄 --- Round ${currentRound} Complete: Resolving Center Pile ---`);
        playAudioFx('win');

        let updatedPlayers = [...players];
        let newCompletedTasks = { ...completedTasks };

        centerPile.forEach(card => {
          if (card.type === 'TASK') {
            const tOwner = card.targetPlayer;
            if (!newCompletedTasks[tOwner]) newCompletedTasks[tOwner] = [];
            newCompletedTasks[tOwner].push(card);
            addLog(`✅ Task completed for Player ${tOwner}!`);
          } else if (card.type === 'KILL') {
            const targetPId = card.targetPlayer;
            const targetPlayer = updatedPlayers.find(p => p.id === targetPId);

            if (targetPlayer && targetPlayer.isAlive) {
              const hasShield = targetPlayer.hand.some(c => c.type === 'SHIELD');
              if (hasShield) {
                playAudioFx('shield');
                addLog(`🛡️ Player ${targetPId}'s Shield blocked the Kill Card attack!`);
                updatedPlayers = updatedPlayers.map(p => p.id === targetPId ? { ...p, hand: p.hand.filter(c => c.type !== 'SHIELD') } : p);
              } else {
                playAudioFx('kill');
                addLog(`💀 Kill successful! Player ${targetPId} eliminated.`);
                updatedPlayers = eliminateAndDistributeCards(targetPId, updatedPlayers);
              }
            }
          }
        });

        updatedPlayers.forEach(p => {
          if (p.isAlive) {
            while (p.hand.length < 3 && p.deck.length > 0) {
              p.hand.push(p.deck.shift());
            }
          }
        });

        const activeSurvivors = updatedPlayers.filter(p => p.isAlive).map(p => p.id);
        const nextStartingIdx = (roundStartingIndex + 1) % activeSurvivors.length;

        setPlayers(updatedPlayers);
        setCompletedTasks(newCompletedTasks);
        setCenterPile([]);
        setCenterPileBlocked(false);
        setCurrentRound(prev => prev + 1);
        setRoundStartingIndex(nextStartingIdx);
        setTurnQueue(activeSurvivors);
        setQueueIndex(nextStartingIdx);

        for (let [pId, tasks] of Object.entries(newCompletedTasks)) {
          if (tasks.length >= 4) {
            setGameWinner(`Player ${pId} (Tasks Completed)`);
            setGameState('GAME_OVER');
            return;
          }
        }
      };

      return (
        <div className="h-full w-full flex flex-col bg-zinc-950 text-zinc-100 select-none">
          {gameState === 'LOBBY' && (
            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-6">
              <h1 className="text-4xl sm:text-6xl font-black bg-gradient-to-r from-red-600 to-amber-500 bg-clip-text text-transparent">
                K? THE CARD GAME
              </h1>
              <p className="text-zinc-400 text-sm max-w-md">
                Official Rulebook Simulator. Complete tasks, deploy shields, execute stealth kills, or uncover the Killers.
              </p>

              <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
                <div>
                  <label className="text-xs font-bold text-zinc-400 block mb-2">PLAYER COUNT: {playerCount}</label>
                  <input 
                    type="range" min="4" max="10" value={playerCount} 
                    onChange={e => setPlayerCount(parseInt(e.target.value))}
                    className="w-full accent-red-600 cursor-pointer"
                  />
                </div>

                <div className="flex gap-2">
                  <button 
                    onClick={() => setIsVsBots(true)}
                    className={`flex-1 py-2.5 rounded-xl text-xs font-bold border transition ${isVsBots ? 'bg-red-600 border-red-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-400'}`}
                  >
                    VS BOTS 🤖
                  </button>
                  <button 
                    onClick={() => setIsVsBots(false)}
                    className={`flex-1 py-2.5 rounded-xl text-xs font-bold border transition ${!isVsBots ? 'bg-red-600 border-red-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-400'}`}
                  >
                    LOCAL PASS 👥
                  </button>
                </div>

                <button 
                  onClick={startGame}
                  className="w-full py-4 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 font-black rounded-2xl text-white shadow-lg transition active:scale-95"
                >
                  START SIMULATION
                </button>
              </div>
            </div>
          )}

          {gameState === 'PLAYING' && activePlayer && (
            <div className="flex-1 flex flex-col justify-between p-4 max-w-5xl mx-auto w-full">
              {/* TOP BAR */}
              <div className="flex justify-between items-center bg-zinc-900/90 border border-zinc-800 px-4 py-3 rounded-2xl text-xs">
                <span className="font-black text-zinc-300">Round {currentRound}</span>
                <span className="font-bold text-amber-400">{botThinkingStatus || `Turn: ${activePlayer.name}`}</span>
                <span className="px-3 py-1 rounded-full font-bold bg-red-950 border border-red-800 text-red-400">
                  Role: {activePlayer.role}
                </span>
              </div>

              {/* CENTER TABLE & PILE */}
              <div className="flex-1 my-4 bg-zinc-900/50 border border-zinc-800/80 rounded-3xl p-6 flex flex-col items-center justify-center relative min-h-[240px]">
                <div className="absolute top-4 left-4 text-xs font-semibold text-zinc-500 uppercase tracking-widest">
                  Center Pile ({centerPile.length} Cards)
                </div>
                <div className="flex flex-wrap gap-3 justify-center max-w-lg">
                  {centerPile.length === 0 ? (
                    <span className="text-zinc-600 italic text-sm">Center pile is empty this round...</span>
                  ) : (
                    centerPile.map((card, idx) => (
                      <div key={idx} className="w-16 h-24 bg-zinc-800 border border-zinc-700 rounded-xl p-2 flex flex-col justify-between text-[10px] shadow">
                        <span className="font-black text-red-400">FACE-DOWN</span>
                        <span className="text-zinc-400 text-center truncate">P{card.playedBy}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* CONTROLS & LOGS */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                <div className="md:col-span-2 bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 h-32 overflow-y-auto text-xs font-mono text-zinc-300 space-y-1 shadow-inner">
                  {turnLogs.map((log, idx) => <div key={idx}>&gt; {log}</div>)}
                </div>

                <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 flex flex-col justify-center space-y-2 shadow">
                  <div className="text-xs font-bold text-zinc-400 text-center">ACTIONS</div>
                  <button 
                    disabled={!selectedCard || activePlayer.isBot}
                    onClick={() => executeCardPlay(activePlayer.id, selectedCard, 'CENTER')}
                    className="w-full py-2.5 bg-red-600 hover:bg-red-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs shadow transition"
                  >
                    Place Face-Down in Center
                  </button>
                  <button 
                    disabled={!selectedCard || activePlayer.isBot}
                    onClick={() => executeCardPlay(activePlayer.id, selectedCard, 'NEXT_DECK')}
                    className="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-50 text-zinc-200 font-bold rounded-xl text-xs border border-zinc-700 transition"
                  >
                    Pass to Next Deck
                  </button>
                </div>
              </div>

              {/* HAND TRAY */}
              <div className="p-4 rounded-3xl border bg-zinc-900/80 border-zinc-800 flex flex-col space-y-2 shadow-2xl">
                <div className="flex justify-between items-center px-1 text-xs">
                  <span className="font-bold text-zinc-300">{activePlayer.name}'s HAND</span>
                  <span className="text-zinc-400">Tasks Completed: {completedTasks[activePlayer.id]?.length || 0}/4</span>
                </div>
                <div className="flex space-x-3 overflow-x-auto pb-2 pt-1">
                  {activePlayer.hand.map(card => (
                    <div key={card.id} className="flex-shrink-0 w-32">
                      <VisualCard 
                        card={card}
                        isSelected={selectedCard?.id === card.id}
                        onClick={() => !activePlayer.isBot && setSelectedCard(card)}
                      />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {gameState === 'GAME_OVER' && (
            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-6">
              <h1 className="text-5xl font-black text-amber-400">MATCH OVER</h1>
              <p className="text-xl text-zinc-300 font-bold">Winner: {gameWinner}</p>
              <button 
                onClick={() => setGameState('LOBBY')}
                className="px-8 py-4 bg-red-600 hover:bg-red-500 font-bold rounded-2xl text-white shadow-xl transition"
              >
                RETURN TO MENU
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
