<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K: The Card Game - Pro 3.1 Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { red: '#dc2626', slate: '#09090b', emerald: '#10b981' } }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    body { touch-action: manipulation; user-select: none; background-color: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.9); }
    }
    .active-turn-indicator { animation: pulseGlow 1.5s infinite ease-in-out; border-color: #dc2626; }
    .card-3d { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-3d:hover { transform: translateY(-8px) scale(1.02); }
  </style>
</head>
<body class="h-full w-full overflow-x-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playAudioFx = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        
        if (type === 'card') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        }
      } catch (e) {}
    };

    const getExplicitPlayerName = (idx) => {
      if (idx === 0) return 'Player One';
      if (idx === 1) return 'Player Two';
      if (idx === 2) return 'Player Three Bot';
      if (idx === 3) return 'Player Four Bot';
      return `Player ${idx + 1}`;
    };

    const generateDecks = (playerCount) => {
      let roles = ['KILLER', ...Array(playerCount - 1).fill('SAFE')].sort(() => Math.random() - 0.5);
      let mainDeck = [];
      
      for (let p = 1; p <= playerCount; p++) {
        for (let t = 1; t <= 4; t++) {
          mainDeck.push({ id: `t_${p}_${t}_${Math.random()}`, type: 'TASK', targetPlayer: p, name: `${getExplicitPlayerName(p - 1)} Task ${t}`, desc: 'Complete for victory.' });
        }
        for (let k = 1; k <= 2; k++) {
          mainDeck.push({ id: `k_${p}_${k}_${Math.random()}`, type: 'KILL', targetPlayer: p, name: 'Kill Card', desc: 'Lethal attack.' });
        }
        mainDeck.push({ id: `s_${p}_${Math.random()}`, type: 'SHIELD', name: 'Shield Card', desc: 'Blocks 1 attack.' });
      }

      mainDeck.sort(() => Math.random() - 0.5);
      
      const playerDecks = {};
      const playerHands = {};
      for (let p = 1; p <= playerCount; p++) {
        playerDecks[p] = mainDeck.splice(0, 9);
        playerHands[p] = playerDecks[p].splice(0, 3);
      }
      return { roles, playerDecks, playerHands };
    };

    function App() {
      const [screen, setScreen] = useState('MENU');
      const [networkMode, setNetworkMode] = useState('SOLO');
      const [roomCode, setRoomCode] = useState('');
      const [joinCode, setJoinCode] = useState('');
      
      const [players, setPlayers] = useState([]);
      const [myId, setMyId] = useState(1);
      const [currentRound, setCurrentRound] = useState(1);
      const [centerPile, setCenterPile] = useState([]);
      const [activeTurnId, setActiveTurnId] = useState(1);
      const [logs, setLogs] = useState(['Game initialized. Choose a mode.']);
      const [selectedCard, setSelectedCard] = useState(null);

      const peerRef = useRef(null);
      const connsRef = useRef([]);
      const botTimerRef = useRef(null);

      const addLog = (msg) => setLogs(prev => [msg, ...prev.slice(0, 49)]);

      const hostRoom = () => {
        const code = 'K' + Math.floor(1000 + Math.random() * 9000);
        setRoomCode(code);
        const peer = new Peer(code);
        peerRef.current = peer;

        peer.on('open', () => {
          setNetworkMode('HOST');
          setScreen('LOBBY');
          setPlayers([{ id: 1, name: 'Player One', isBot: false, role: 'SAFE', deck: [], hand: [], tasks: 0, isAlive: true }]);
          setMyId(1);
          addLog(`Room hosted: ${code}`);
        });

        peer.on('connection', (conn) => {
          connsRef.current.push(conn);
          setPlayers(prev => {
            const pId = prev.length + 1;
            const newP = { id: pId, name: getExplicitPlayerName(pId - 1), isBot: false, role: 'SAFE', deck: [], hand: [], tasks: 0, isAlive: true };
            addLog(`${newP.name} joined!`);
            return [...prev, newP];
          });

          conn.on('data', (data) => {
            if (data.type === 'PLAY_CARD') {
              handleCardPlayAuth(data.playerId, data.card, data.destination);
            }
          });
        });
      };

      const joinRoom = () => {
        const code = joinCode.trim().toUpperCase();
        if (!code) return alert('Enter code!');
        const peer = new Peer();
        peerRef.current = peer;

        peer.on('open', () => {
          const conn = peer.connect(code);
          connsRef.current = [conn];

          conn.on('open', () => {
            setNetworkMode('JOIN');
            setScreen('LOBBY');
            setRoomCode(code);
            addLog(`Connected to ${code}. Waiting for host...`);
          });

          conn.on('data', (data) => {
            if (data.type === 'SYNC') {
              setPlayers(data.players);
              setCurrentRound(data.currentRound);
              setCenterPile(data.centerPile);
              setActiveTurnId(data.activeTurnId);
              setMyId(data.assignedId);
              setLogs(data.logs);
              if (screen !== 'PLAYING') setScreen('PLAYING');
            }
          });
        });
      };

      const syncToClients = (stateUpdates) => {
        if (networkMode !== 'HOST') return;
        connsRef.current.forEach((conn, idx) => {
          conn.send({
            type: 'SYNC',
            assignedId: idx + 2,
            ...stateUpdates
          });
        });
      };

      const startMatch = (isSolo) => {
        let currentPlayers = [...players];
        if (isSolo) {
          currentPlayers = [{ id: 1, name: 'Player One', isBot: false, role: 'SAFE', deck: [], hand: [], tasks: 0, isAlive: true }];
          setNetworkMode('SOLO');
          setMyId(1);
        }

        while (currentPlayers.length < 4) {
          const bId = currentPlayers.length + 1;
          currentPlayers.push({ id: bId, name: getExplicitPlayerName(bId - 1), isBot: true, role: 'SAFE', deck: [], hand: [], tasks: 0, isAlive: true });
        }

        const { roles, playerDecks, playerHands } = generateDecks(currentPlayers.length);
        const readyPlayers = currentPlayers.map((p, idx) => ({
          ...p, role: roles[idx], deck: playerDecks[p.id], hand: playerHands[p.id]
        }));

        setPlayers(readyPlayers);
        setActiveTurnId(1);
        setCenterPile([]);
        setCurrentRound(1);
        setScreen('PLAYING');
        const newLogs = ['Match started! Auto-bots filled. Round 1 begins.'];
        setLogs(newLogs);

        syncToClients({ players: readyPlayers, activeTurnId: 1, centerPile: [], currentRound: 1, logs: newLogs });
      };

      const handleCardPlayAuth = (playerId, card, destination) => {
        let updatedPlayers = [...players];
        const playerIdx = updatedPlayers.findIndex(p => p.id === playerId);
        const pObj = updatedPlayers[playerIdx];

        if (card) {
          updatedPlayers[playerIdx] = { ...pObj, hand: pObj.hand.filter(c => c.id !== card.id) };
        }
        
        let newCenter = [...centerPile];
        let latestLogs = [...logs];
        
        if (destination === 'CENTER' && card) {
          newCenter.push({ ...card, playedBy: pObj.name });
          latestLogs.unshift(`🃏 ${pObj.name} played a card face-down.`);
        } else if (card) {
          const nextAlive = updatedPlayers.find(p => p.id > playerId && p.isAlive) || updatedPlayers.find(p => p.isAlive);
          if (nextAlive) {
            const nIdx = updatedPlayers.findIndex(p => p.id === nextAlive.id);
            updatedPlayers[nIdx].deck.unshift(card);
            latestLogs.unshift(`➡️ ${pObj.name} passed a card to ${nextAlive.name}.`);
          }
        } else {
          latestLogs.unshift(`⏭️ ${pObj.name} had no cards and passed their turn.`);
        }

        playAudioFx('card');

        if (newCenter.length >= updatedPlayers.filter(p => p.isAlive).length) {
          resolveRoundAuth(updatedPlayers, newCenter, latestLogs);
        } else {
          const nextP = updatedPlayers.find(p => p.id > playerId && p.isAlive) || updatedPlayers.find(p => p.isAlive);
          setPlayers(updatedPlayers);
          setCenterPile(newCenter);
          setActiveTurnId(nextP.id);
          setLogs(latestLogs.slice(0, 50));
          syncToClients({ players: updatedPlayers, centerPile: newCenter, activeTurnId: nextP.id, currentRound, logs: latestLogs.slice(0, 50) });
        }
      };

      const resolveRoundAuth = (currentPList, currentCenter, currentLogs) => {
        currentLogs.unshift(`🔄 Resolving Round ${currentRound}... Deck shuffled.`);
        playAudioFx('win');

        let updatedList = [...currentPList];
        
        currentCenter.forEach(c => {
          if (c.type === 'TASK') {
            const tIdx = updatedList.findIndex(p => p.id === c.targetPlayer);
            if (tIdx > -1) {
              updatedList[tIdx].tasks += 1;
              currentLogs.unshift(`✅ ${updatedList[tIdx].name} completed a task!`);
            }
          }
        });

        updatedList = updatedList.map(p => {
          let newHand = [...p.hand];
          let newDeck = [...p.deck];
          while (newHand.length < 3 && newDeck.length > 0) {
            newHand.push(newDeck.shift());
          }
          return { ...p, hand: newHand, deck: newDeck };
        });

        const nextRound = currentRound + 1;
        const firstAlive = updatedList.find(p => p.isAlive).id;

        setPlayers(updatedList);
        setCenterPile([]);
        setCurrentRound(nextRound);
        setActiveTurnId(firstAlive);
        setLogs(currentLogs.slice(0, 50));
        setSelectedCard(null);

        syncToClients({ players: updatedList, centerPile: [], currentRound: nextRound, activeTurnId: firstAlive, logs: currentLogs.slice(0, 50) });
      };

      const requestPlayCard = (destination) => {
        if (activeTurnId !== myId) return alert("Not your turn!");
        if (!selectedCard) return alert("Select a card!");
        
        if (networkMode === 'JOIN') {
          connsRef.current[0].send({ type: 'PLAY_CARD', playerId: myId, card: selectedCard, destination });
          setSelectedCard(null);
        } else {
          handleCardPlayAuth(myId, selectedCard, destination);
          setSelectedCard(null);
        }
      };

      useEffect(() => {
        if (screen !== 'PLAYING' || networkMode === 'JOIN') return;
        
        const activeP = players.find(p => p.id === activeTurnId);
        if (activeP && activeP.isBot) {
          clearTimeout(botTimerRef.current);
          botTimerRef.current = setTimeout(() => {
            if (activeP.hand.length > 0) {
              const randomCard = activeP.hand[0]; 
              handleCardPlayAuth(activeP.id, randomCard, 'CENTER');
            } else {
              handleCardPlayAuth(activeP.id, null, 'PASS'); 
            }
          }, 1500);
        }
        return () => clearTimeout(botTimerRef.current);
      }, [activeTurnId, screen, players]);

      const myPlayer = players.find(p => p.id === myId) || {};
      const activePlayerObj = players.find(p => p.id === activeTurnId) || {};

      return (
        <div className="h-full w-full flex flex-col p-4 max-w-5xl mx-auto justify-center">
          
          {screen === 'MENU' && (
            <div className="flex flex-col items-center text-center space-y-6">
              <h1 className="text-4xl sm:text-6xl font-black bg-gradient-to-r from-red-600 to-amber-500 bg-clip-text text-transparent">
                K: THE CARD GAME
              </h1>
              <p className="text-zinc-400 text-sm max-w-sm">Play offline against bots or host clean K-Codes for online P2P multiplayer.</p>
              
              <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-xl">
                <button onClick={() => startMatch(true)} className="w-full py-3.5 bg-amber-600 hover:bg-amber-500 font-bold rounded-xl text-white shadow transition">
                  PLAY SOLO VS BOTS
                </button>
                <div className="border-t border-zinc-800 pt-2"></div>
                <button onClick={hostRoom} className="w-full py-3.5 bg-red-600 hover:bg-red-500 font-bold rounded-xl text-white shadow transition">
                  CREATE ONLINE ROOM
                </button>
                <div className="flex space-x-2 pt-2">
                  <input type="text" placeholder="K1234" value={joinCode} onChange={e => setJoinCode(e.target.value)}
                    className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 text-sm text-white uppercase text-center font-mono tracking-widest" />
                  <button onClick={joinRoom} className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 font-bold rounded-xl text-white border border-zinc-700 text-sm">
                    JOIN
                  </button>
                </div>
              </div>
            </div>
          )}

          {screen === 'LOBBY' && (
            <div className="flex flex-col items-center text-center space-y-6">
              <h2 className="text-3xl font-black text-white">Online Room Lobby</h2>
              <div className="text-5xl font-mono font-black text-red-500 bg-zinc-900 border border-zinc-800 px-8 py-4 rounded-2xl tracking-widest shadow-inner">
                {roomCode}
              </div>
              <p className="text-zinc-400 text-sm max-w-xs">Empty slots will automatically fill with <b>Player Three Bot</b> & <b>Player Four Bot</b> on start!</p>
              
              <div className="bg-zinc-900/80 border border-zinc-800 p-4 rounded-2xl w-full max-w-sm text-left space-y-2">
                <div className="text-xs font-bold text-zinc-500">CONNECTED PLAYERS:</div>
                {players.map((p) => (
                  <div key={p.id} className="text-white font-semibold flex items-center gap-2">
                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> {p.name}
                  </div>
                ))}
              </div>

              {networkMode === 'HOST' ? (
                <button onClick={() => startMatch(false)} className="px-8 py-4 bg-red-600 hover:bg-red-500 font-black rounded-2xl text-white shadow-xl transition active:scale-95">
                  START MATCH & FILL BOTS
                </button>
              ) : (
                <p className="text-amber-400 text-sm font-bold animate-pulse">Waiting for host to start...</p>
              )}
            </div>
          )}

          {screen === 'PLAYING' && (
            <div className="flex flex-col space-y-4 flex-1 py-2">
              
              <div className="flex justify-between items-center bg-zinc-900 p-3 rounded-2xl border border-zinc-800 text-xs shadow">
                <span className="font-bold text-zinc-300 px-2 py-1 bg-zinc-800 rounded-lg">Round {currentRound}</span>
                <span className={`font-black uppercase px-4 py-1.5 rounded-full border ${activeTurnId === myId ? 'active-turn-indicator text-white bg-red-900' : 'border-zinc-700 text-amber-400 bg-zinc-800'}`}>
                  {activePlayerObj.name}'s Turn
                </span>
                <span className="font-bold text-red-400 px-2 py-1 bg-red-950 border border-red-900 rounded-lg">
                  Role: {myPlayer.role || 'SPECTATOR'}
                </span>
              </div>

              <div className="flex-1 bg-zinc-900/60 border border-zinc-800 rounded-3xl p-6 flex flex-col items-center justify-center relative shadow-inner min-h-[220px]">
                <div className="absolute top-4 left-4 text-[10px] font-bold text-zinc-500 uppercase tracking-widest bg-zinc-950 px-2 py-1 rounded-md border border-zinc-800">
                  Center Pile ({centerPile.length}/{players.filter(p => p.isAlive).length})
                </div>
                <div className="flex flex-wrap gap-3 justify-center">
                  {centerPile.length === 0 ? (
                    <span className="text-zinc-600 italic text-sm">Awaiting card submissions...</span>
                  ) : (
                    centerPile.map((c, i) => (
                      <div key={i} className="w-20 h-28 bg-zinc-800 border-2 border-zinc-700 rounded-xl p-2 flex flex-col justify-between text-[10px] shadow-lg">
                        <span className="font-black text-red-500 tracking-wider">FACE-DOWN</span>
                        <span className="text-zinc-400 text-center truncate">{c.playedBy}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div className="md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-2xl p-3 h-32 overflow-y-auto text-xs font-mono text-zinc-400 space-y-1 shadow-inner">
                  {logs.map((l, i) => <div key={i} className={i === 0 ? 'text-zinc-100 font-bold' : ''}>&gt; {l}</div>)}
                </div>
                
                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col justify-center space-y-2">
                  <button 
                    disabled={activeTurnId !== myId || !selectedCard}
                    onClick={() => requestPlayCard('CENTER')} 
                    className="w-full py-2.5 bg-red-600 hover:bg-red-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs transition shadow"
                  >
                    Place in Center
                  </button>
                  <button 
                    disabled={activeTurnId !== myId || !selectedCard}
                    onClick={() => requestPlayCard('PASS')} 
                    className="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-50 text-zinc-200 font-bold rounded-xl text-xs border border-zinc-700 transition"
                  >
                    Pass to Next Player
                  </button>
                </div>
              </div>

              <div className="p-4 rounded-3xl border bg-zinc-900/80 border-zinc-800 flex flex-col space-y-3 shadow-xl">
                <div className="flex justify-between items-center px-1">
                  <span className="font-black text-zinc-200 text-sm tracking-wide">YOUR HAND ({myPlayer.name})</span>
                  <span className="text-zinc-400 text-xs font-bold bg-zinc-800 px-3 py-1 rounded-full">Tasks: {myPlayer.tasks}/4</span>
                </div>
                <div className="flex gap-3 overflow-x-auto pb-2 pt-1 px-1">
                  {(myPlayer.hand || []).length === 0 ? (
                    <div className="text-zinc-500 italic text-sm py-4">Hand empty. Waiting for round to end...</div>
                  ) : (
                    myPlayer.hand.map((card) => (
                      <div 
                        key={card.id} 
                        onClick={() => setSelectedCard(card)}
                        className={`w-32 h-44 bg-zinc-900 border-2 rounded-2xl p-3 flex flex-col justify-between cursor-pointer card-3d flex-shrink-0 ${selectedCard?.id === card.id ? 'border-red-500 ring-2 ring-red-500/50 -translate-y-2 shadow-[0_10px_20px_rgba(220,38,38,0.2)]' : 'border-zinc-700 hover:border-zinc-500'}`}
                      >
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-full self-start border ${card.type === 'TASK' ? 'text-emerald-400 bg-emerald-950 border-emerald-800' : card.type === 'KILL' ? 'text-red-400 bg-red-950 border-red-800' : 'text-blue-400 bg-blue-950 border-blue-800'}`}>
                          {card.type}
                        </span>
                        <div className="mt-auto">
                          <h4 className="font-black text-xs text-white leading-tight mb-1">{card.name}</h4>
                          <p className="text-[10px] text-zinc-400 leading-tight">{card.desc}</p>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
